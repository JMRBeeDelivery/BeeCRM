<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunter de Grandes Contas</title>
<meta name="description" content="CRM de funil para hunting de grandes contas: prospecção ao fechamento, atividades agendadas e indicadores.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&family=Roboto:wght@400;500;600;700;900&display=swap">
<style>
:root{
  /* Identidade Bee Delivery: amarelo #FFDD00 sobre grafite #333, ground #F1F1F1 */
  --mel:#FFDD00;
  --mel-2:#F2CE00;
  --mel-ink:#2B2B2B;

  --paper:#F1F1F1;
  --surface:#FFFFFF;
  --surface-2:#FAFAF8;
  --ink:#333333;
  --ink-2:#5E5E5A;
  --ink-3:#8C8C88;
  --line:#DEDEDA;
  --line-soft:#EAEAE6;
  --accent:#FFDD00;
  --accent-ink:#2B2B2B;
  --accent-forte:#8A6D00;
  --accent-wash:#FFF6CC;
  --ok:#1E7A47;
  --ok-wash:#E4F1E9;
  --signal:#8A6D00;
  --signal-wash:#FFF1B8;
  --danger:#B3261E;
  --danger-wash:#FBE4E2;
  --shadow:0 1px 2px rgba(51,51,51,.07), 0 8px 24px rgba(51,51,51,.08);
  --shadow-soft:0 1px 2px rgba(51,51,51,.06);

  --e1:#7E8794; --e2:#5C7D8A; --e3:#3F7F6E; --e4:#6B8F3A;
  --e5:#A8791C; --e6:#D4A200; --e7:#1E7A47;
  --st-perdido:#B3261E; --st-congelado:#8C8C88;

  --at-email:#5C7D8A; --at-tel:#3F7F6E; --at-zap:#1E7A47;
  --at-linkedin:#4A5E96; --at-reuniao:#C29100; --at-follow:#7E8794;

  --r:10px;
  --f-display:"Roboto","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-body:"Open Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171717; --surface:#212121; --surface-2:#292928;
    --ink:#EDEDEA; --ink-2:#B4B4AE; --ink-3:#8A8A85;
    --line:#3A3A38; --line-soft:#2F2F2D;
    --accent:#FFDD00; --accent-ink:#2B2B2B; --accent-forte:#F0CE4A; --accent-wash:#3A3208;
    --ok:#4FB37A; --ok-wash:#17301F;
    --signal:#F0CE4A; --signal-wash:#3A3208;
    --danger:#E4736A; --danger-wash:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
    --shadow-soft:0 1px 2px rgba(0,0,0,.4);
    --e1:#9BA5B3; --e2:#7FA3B1; --e3:#5AA692; --e4:#93B85C;
    --e5:#D3A23F; --e6:#FFD23F; --e7:#4FB37A;
    --st-perdido:#E4736A; --st-congelado:#9A9A95;
    --at-email:#7FA3B1; --at-tel:#5AA692; --at-zap:#4FB37A;
    --at-linkedin:#8592C9; --at-reuniao:#E5B93C; --at-follow:#9BA5B3;
  }
}
:root[data-theme="dark"]{
  --paper:#171717; --surface:#212121; --surface-2:#292928;
  --ink:#EDEDEA; --ink-2:#B4B4AE; --ink-3:#8A8A85;
  --line:#3A3A38; --line-soft:#2F2F2D;
  --accent:#FFDD00; --accent-ink:#2B2B2B; --accent-forte:#F0CE4A; --accent-wash:#3A3208;
  --ok:#4FB37A; --ok-wash:#17301F;
  --signal:#F0CE4A; --signal-wash:#3A3208;
  --danger:#E4736A; --danger-wash:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
  --shadow-soft:0 1px 2px rgba(0,0,0,.4);
  --e1:#9BA5B3; --e2:#7FA3B1; --e3:#5AA692; --e4:#93B85C;
  --e5:#D3A23F; --e6:#FFD23F; --e7:#4FB37A;
  --st-perdido:#E4736A; --st-congelado:#9A9A95;
  --at-email:#7FA3B1; --at-tel:#5AA692; --at-zap:#4FB37A;
  --at-linkedin:#8592C9; --at-reuniao:#E5B93C; --at-follow:#9BA5B3;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-forte);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- porta de entrada ---------- */
.portao{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:28px 20px;background:var(--mel);
}
.portao-card{
  width:min(420px,100%);background:#fff;border-radius:14px;padding:30px 30px 26px;
  box-shadow:0 2px 4px rgba(0,0,0,.1), 0 18px 44px rgba(0,0,0,.16);color:#333;
}
.portao-marca{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.portao-marca h1{font-size:19px;font-weight:900;letter-spacing:-.02em;color:#2B2B2B}
.portao-card h2{font-size:15px;font-weight:700;margin-bottom:4px;color:#2B2B2B}
.portao-card p.intro{font-size:13px;color:#5E5E5A;margin:0 0 20px}
.portao-campo{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.portao-campo label{font-size:11px;font-weight:700;color:#5E5E5A;letter-spacing:.03em;text-transform:uppercase}
.portao-campo input{
  border:1px solid #DEDEDA;border-radius:9px;padding:11px 12px;background:#fff;color:#333;outline:none;
}
.portao-campo input:focus{border-color:#8A6D00;box-shadow:0 0 0 3px rgba(255,221,0,.35)}
.portao-btn{
  width:100%;border:0;background:#2B2B2B;color:#FFDD00;font-family:var(--f-display);
  font-weight:700;font-size:15px;padding:12px;border-radius:9px;margin-top:6px;
}
.portao-btn:hover{background:#1C1C1C}
.portao-btn:disabled{opacity:.6;cursor:progress}
.portao-erro{
  background:#FBE4E2;color:#8E1F18;border-radius:9px;padding:10px 12px;
  font-size:12.5px;margin-bottom:16px;
}
.portao-nota{font-size:11.5px;color:#8C8C88;margin:18px 0 0;line-height:1.55}
.portao-nota code{font-family:var(--f-mono);font-size:11px;background:#F1F1F1;padding:1px 5px;border-radius:4px;color:#5E5E5A}
.portao-passos{margin:0;padding-left:18px;font-size:12.5px;color:#5E5E5A;line-height:1.7}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 22px;background:var(--mel);color:var(--mel-ink);
  border-bottom:1px solid rgba(0,0,0,.14);position:sticky;top:0;z-index:40;
  --ink:#2B2B2B; --ink-2:#4D4200; --ink-3:#6B5C00;
  --line:rgba(0,0,0,.18); --line-soft:rgba(0,0,0,.10);
  --surface:#FFFFFF; --surface-2:rgba(255,255,255,.55);
}
.brand{display:flex;align-items:center;gap:9px;margin-right:2px}
.brand .marca{display:block;flex:none}
.brand h1{font-size:17px;font-weight:900;letter-spacing:-.02em;color:#2B2B2B}
.views{display:flex;gap:2px;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.10);border-radius:var(--r);padding:3px}
.views button{border:0;background:transparent;color:#5B4E00;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;font-family:var(--f-display)}
.views button:hover{color:#2B2B2B}
.views button[aria-selected="true"]{background:#FFFFFF;color:#2B2B2B;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.views .aviso{display:inline-block;min-width:17px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--danger);color:#fff;font-family:var(--f-mono);font-size:10px;line-height:16px}
.spacer{flex:1 1 auto}
.quem{display:flex;align-items:center;gap:8px;padding-left:4px}
.quem-av{
  width:28px;height:28px;border-radius:50%;background:#2B2B2B;color:var(--mel);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12px;flex:none;
}
.quem-txt{display:flex;flex-direction:column;line-height:1.25}
.quem-nome{font-size:12.5px;font-weight:700;color:#2B2B2B}
.quem-papel{font-size:10px;color:#6B5C00;letter-spacing:.05em;text-transform:uppercase}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:0 11px;min-width:190px}
.search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none}
.search svg{flex:none;color:var(--ink-3)}
select.filtro{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--ink-2);max-width:168px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn-primary:hover{background:var(--mel-2);border-color:var(--mel-2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line-soft)}
.btn-danger{color:var(--danger);border-color:var(--line)}
.btn-danger:hover{background:var(--danger-wash);border-color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.masthead .btn-primary{background:#2B2B2B;color:var(--mel);border-color:#2B2B2B}
.masthead .btn-primary:hover{background:#1C1C1C;border-color:#1C1C1C}
.masthead .btn{border-color:rgba(0,0,0,.2)}

/* ---------- avisos ---------- */
.banner{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin:14px 22px 0;padding:10px 14px;border-radius:var(--r);
  background:var(--signal-wash);border:1px solid rgba(138,109,0,.32);
  color:var(--ink-2);font-size:13px;
}
.banner strong{color:var(--ink)}
.banner.ruim{background:var(--danger-wash);border-color:rgba(179,38,30,.3)}

/* ---------- faixa do funil ---------- */
.funil{display:flex;gap:0;padding:14px 22px 0;overflow-x:auto}
.funil-item{flex:1 1 0;min-width:128px;padding:10px 14px 12px;border-left:3px solid var(--st);display:flex;flex-direction:column;gap:2px}
.funil-item + .funil-item{margin-left:8px}
.funil-nome{font-size:11px;font-weight:600;color:var(--st);letter-spacing:.02em;line-height:1.25}
.funil-valor{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.funil-qtd{font-size:11.5px;color:var(--ink-3)}

/* ---------- quadro ---------- */
.board{display:flex;gap:12px;padding:16px 22px 26px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 286px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 232px)}
.col.drop{border-color:var(--st);box-shadow:0 0 0 2px color-mix(in srgb,var(--st) 22%,transparent)}
.col-head{padding:11px 13px 9px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface);border-radius:12px 12px 0 0}
.col-dot{width:8px;height:8px;border-radius:2px;background:var(--st);flex:none}
.col-head h3{font-size:12.5px;font-weight:700;flex:1;letter-spacing:0}
.col-count{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);border-radius:20px;padding:1px 7px}
.col-body{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.col-total{padding:8px 13px;border-top:1px solid var(--line-soft);font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.col-empty{padding:16px 10px;text-align:center;color:var(--ink-3);font-size:12px;border:1px dashed var(--line);border-radius:9px}

.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--shadow-soft);text-align:left;width:100%}
.card:hover{border-color:var(--ink-3);border-left-color:var(--st)}
.card.dragging{opacity:.45}
.card.ganho{border-left-color:var(--e7)}
.card.perdido{border-left-color:var(--st-perdido);opacity:.72}
.card.congelado{border-left-color:var(--st-congelado);opacity:.72}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-emp{font-family:var(--f-display);font-size:13.5px;font-weight:700;line-height:1.28;flex:1}
.card-num{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;text-align:right;padding-top:1px;line-height:1.35}
.card-num small{display:block;font-size:9.5px;color:var(--ink-3);letter-spacing:.02em;font-weight:400}
.card-meta{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.card-ativ{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--ink-2);border-top:1px dashed var(--line-soft);padding-top:6px}
.card-ativ i{width:6px;height:6px;border-radius:50%;background:var(--at);flex:none;align-self:center}
.card-ativ b{font-weight:700;color:var(--at);white-space:nowrap}
.card-ativ span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-soft);white-space:nowrap}
.chip.atraso{background:var(--danger-wash);color:var(--danger);border-color:transparent;font-weight:700}
.chip.hoje{background:var(--signal-wash);color:var(--signal);border-color:transparent;font-weight:700}
.chip.ex{background:transparent;border-style:dashed;color:var(--ink-3)}
.chip.won{background:var(--ok-wash);color:var(--ok);border-color:transparent;font-weight:700}
.chip.dono{background:var(--accent-wash);color:var(--accent-forte);border-color:transparent;font-weight:600}
.card-prog{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.card-prog i{display:block;height:100%;background:var(--st)}

/* ---------- agenda ---------- */
.page{padding:16px 22px 40px;max-width:1180px}
.grupo{margin-bottom:26px}
.grupo-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.grupo-head h3{font-size:14px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:11px;overflow:hidden}
.linha{display:grid;grid-template-columns:74px 128px minmax(140px,1fr) minmax(160px,1.5fr) 96px;gap:12px;align-items:center;padding:10px 14px;background:var(--surface)}
.linha:hover{background:var(--surface-2)}
.linha .l-data{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.linha .l-data small{display:block;font-size:10.5px;color:var(--ink-3)}
.linha .l-tipo{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--at)}
.linha .l-tipo i{width:6px;height:6px;border-radius:50%;background:var(--at);flex:none}
.linha .l-emp{font-weight:700;font-size:13px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--f-display)}
.linha .l-emp:hover{color:var(--accent-forte);text-decoration:underline}
.linha .l-emp small{display:block;font-weight:400;font-size:10.5px;color:var(--ink-3);text-decoration:none;font-family:var(--f-body)}
.linha .l-desc{font-size:12.5px;color:var(--ink-2)}
.linha .l-acao{display:flex;justify-content:flex-end}
@media (max-width:820px){
  .linha{grid-template-columns:1fr auto;gap:5px 10px}
  .linha .l-desc{grid-column:1/-1}
  .linha .l-acao{grid-column:1/-1;justify-content:flex-start}
}
.vazio{padding:28px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:11px}
.vazio .btn{margin-top:12px}

/* ---------- metas ---------- */
.metas-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.metas-head h2{font-size:17px;font-weight:700}
.metas-sub{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
.metas-nav{display:flex;gap:6px;margin-left:auto}
.metas-nav .btn[disabled]{opacity:.38;cursor:default}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px}
.meta-grid.dois{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:760px}
.meta-card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:14px 16px 15px;border-top:3px solid var(--line);
}
.meta-card.ok{border-top-color:var(--ok)}
.meta-card.atras{border-top-color:var(--danger)}
.meta-num{display:flex;align-items:baseline;gap:6px;margin:6px 0 9px}
.meta-num b{font-family:var(--f-display);font-size:33px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.meta-num span{font-family:var(--f-mono);font-size:14px;color:var(--ink-3)}
.meta-trilho{position:relative;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-soft);overflow:hidden}
.meta-trilho i{display:block;height:100%;border-radius:4px}
.meta-trilho u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.55;text-decoration:none}
.meta-sit{font-size:11.5px;font-weight:600;margin-top:8px}
.meta-desc{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.4}

.meta-hist{border-collapse:collapse;width:100%;min-width:520px}
.meta-hist th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--ink-3);padding:0 4px 8px;text-align:center}
.meta-hist tbody th{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;padding:6px 12px 6px 0;white-space:nowrap}
.meta-hist th.atual,.meta-hist td.atual{color:var(--ink);font-weight:700}
.meta-hist td{text-align:center;padding:4px;vertical-align:bottom}
.meta-hist .hcel{
  display:block;width:100%;max-width:34px;margin:0 auto;height:26px;border-radius:3px;
  background:var(--surface-2);position:relative;overflow:hidden;
}
.meta-hist .hcel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--ink-3);opacity:.35}
.meta-hist .hcel.ok::after{background:var(--ok);opacity:1}
.meta-hist .hcel.parcial::after{background:var(--mel-2);opacity:1}
.meta-hist .hcel.zero::after{height:2px;background:var(--line);opacity:1}
.meta-hist em{display:block;font-family:var(--f-mono);font-size:10px;font-style:normal;color:var(--ink-3);margin-top:3px}
.metas-nota{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:22px;max-width:70ch}

/* ---------- relatório ---------- */
.relatorio{max-width:1000px}
.rel-topo{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.rel-topo h2{font-size:18px;font-weight:700}
.rel-acoes{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.rel-tipo{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-right:4px}
.rel-tipo button{border:0;background:transparent;color:var(--ink-2);padding:4px 12px;border-radius:6px;font-size:12.5px;font-weight:600}
.rel-tipo button.on{background:var(--mel);color:#2B2B2B}
.rel-acoes .btn[disabled]{opacity:.38;cursor:default}

.rel-fita{

<script>
(function(){
"use strict";

/* ============================================================
   1. Playbook de etapas
   ============================================================ */
const ETAPAS = [
  { k:"prospeccao", nome:"Prospecção", cor:"var(--e1)", prob:5,
    criterios:["Rede validada dentro do ICP (nº de lojas, praça, operação)","Mapa de stakeholders iniciado","Contato do decisor econômico obtido","Gatilho de abordagem identificado"] },
  { k:"conexao", nome:"Conexão", cor:"var(--e2)", prob:15,
    criterios:["Primeiro contato respondido","Interlocutor confirmado como influenciador ou decisor","Contexto e prioridade do momento captados","Cadência registrada (canal e nº de toques)"] },
  { k:"agendamento", nome:"Agendamento", cor:"var(--e3)", prob:25,
    criterios:["Reunião confirmada por escrito","Convite com pauta enviado","Participantes-chave confirmados","Confirmação D-1 programada"] },
  { k:"maturacao", nome:"Maturação", cor:"var(--e4)", prob:45,
    criterios:["Dor quantificada (entregas atrasadas, ruptura, custo por entrega)","Volume por loja e sazonalidade validados","Processo decisório e prazo mapeados","Champion interno identificado"] },
  { k:"negociacao", nome:"Negociação", cor:"var(--e5)", prob:65,
    criterios:["Proposta formal enviada","Escopo, praças e volume acordados","Política comercial validada internamente","Objeções principais respondidas"] },
  { k:"contratual", nome:"Alinhamento contratual", cor:"var(--e6)", prob:85,
    criterios:["Minuta enviada ao jurídico","SLA de entrega e indicadores acordados","Condições de faturamento definidas","Signatários confirmados"] },
  { k:"fechamento", nome:"Fechamento", cor:"var(--e7)", prob:100,
    criterios:["Contrato assinado","Lojas do piloto definidas","Kickoff agendado com operações","Handover documentado"] }
];
const ETAPA = Object.fromEntries(ETAPAS.map(e => [e.k, e]));

const TIPOS_ATIVIDADE = [
  {k:"E-mail",            cor:"var(--at-email)"},
  {k:"Telefonema",        cor:"var(--at-tel)"},
  {k:"Envio de WhatsApp", cor:"var(--at-zap)"},
  {k:"LinkedIn",          cor:"var(--at-linkedin)"},
  {k:"Reunião",           cor:"var(--at-reuniao)"},
  {k:"Follow-up",         cor:"var(--at-follow)"}
];
const COR_TIPO = Object.fromEntries(TIPOS_ATIVIDADE.map(t => [t.k, t.cor]));
const corDe = t => COR_TIPO[t] || "var(--ink-3)";
/* o histórico aceita tudo que se agenda, mais o que só se registra depois */
const TIPOS_INTERACAO = TIPOS_ATIVIDADE.map(t => t.k).concat(["Visita","Proposta enviada","No-show","Nota interna"]);
const TIPOS_NEG = new Set(["No-show"]);

const ORIGENS = ["Outbound frio","LinkedIn / social selling","Indicação","Evento / feira","Inbound","Parceiro","Base reativada","Licitação / RFP"];
const PORTES = ["Rede nacional (300+ lojas)","Rede regional (100–299)","Rede local (20–99)","Até 20 lojas","Grupo econômico"];
const MOTIVOS_PERDA = ["Preço por entrega","Sem prioridade agora","Concorrente","Sem fit com o ICP","Decisor não engajou","Processo interno travado","Sem resposta","Nuvem de entregadores"];
/* ------------------------------------------------------------------
   METAS DO HUNTER — para mudar um número, altere aqui e republique.
   Cada meta conta um evento datado, não um estado do funil.
   ------------------------------------------------------------------ */
const METAS_SEMANA = [
  {k:"prospeccoes",  meta:10, nome:"Novas prospecções",  desc:"Empresas novas cadastradas no CRM"},
  {k:"conexoes",     meta:5,  nome:"Novas conexões",     desc:"Leads que avançaram para a etapa Conexão"},
  {k:"agendamentos", meta:2,  nome:"Reuniões agendadas", desc:"Leads que entraram na etapa Agendamento"},
  {k:"reunioes",     meta:1,  nome:"Reuniões realizadas",desc:"Leads que saíram do Agendamento para frente, mais os perdidos ali com reunião confirmada"}
];
const METAS_MES = [
  {k:"negociacoes",  meta:4,  nome:"Leads em negociação", desc:"Leads que avançaram para a etapa Negociação"},
  {k:"fechamentos",  meta:1,  nome:"Fechamentos",         desc:"Contas marcadas como ganhas"}
];

const TAGS = ["Grandes Contas","Grupos Regionais"];
const COR_TAG = {"Grandes Contas":"var(--e6)", "Grupos Regionais":"var(--e3)"};

const TEMPERATURAS = ["Quente","Morno","Frio"];
const COR_TEMP = {Quente:"var(--danger)", Morno:"var(--at-reuniao)", Frio:"var(--at-email)"};
const FITS = ["Alto","Médio","Baixo"];

/* ============================================================
   2. Utilitários
   ============================================================ */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hojeISO(){ return iso(new Date()); }
function parseISO(s){ if(!s) return null; const p=String(s).slice(0,10).split("-"); if(p.length!==3) return null; const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function diasAte(s){ const d=parseISO(s); if(!d) return null; const h=new Date(); h.setHours(0,0,0,0); return Math.round((d-h)/86400000); }
function fmtData(s){ const d=parseISO(s); if(!d) return "—"; return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getFullYear()).slice(2); }
function num(n){ return (Number(n)||0).toLocaleString("pt-BR"); }
function numCurto(n){
  n = Number(n)||0;
  if(n >= 1e6) return (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";
  if(n >= 1000) return (n/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";
  return String(n);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c === "x" ? r : (r&0x3|0x8)).toString(16);
  });
}
function opcoes(lista, sel){ return lista.map(o => '<option value="'+esc(o)+'"'+(o===sel?" selected":"")+">"+esc(o)+"</option>").join(""); }
function iniciais(nome){
  const p = String(nome||"?").trim().split(/\s+/);
  return ((p[0]||"?")[0] + (p.length>1 ? p[p.length-1][0] : "")).toUpperCase();
}
function primeiroNome(nome){ return String(nome||"").trim().split(/\s+/)[0] || ""; }

let toastTimer = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role","status"); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3400);
}

const BUCKET = "anexos";
const TAMANHO_MAX = 25 * 1024 * 1024;
const EXT_BLOQUEADAS = ["exe","bat","cmd","com","msi","scr","vbs","js","jar","ps1","sh","dll","apk"];

function tamanhoLegivel(b){
  b = Number(b) || 0;
  if(b >= 1048576) return (b/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB";
  if(b >= 1024) return Math.round(b/1024)+" KB";
  return b+" B";
}
function extensaoDe(nome){ const p = String(nome).split("."); return p.length > 1 ? p.pop().toLowerCase() : ""; }
function iconeArquivo(nome){
  const e = extensaoDe(nome);
  if(["pdf"].includes(e)) return "PDF";
  if(["doc","docx","odt"].includes(e)) return "DOC";
  if(["xls","xlsx","csv","ods"].includes(e)) return "XLS";
  if(["ppt","pptx"].includes(e)) return "PPT";
  if(["png","jpg","jpeg","gif","webp","heic","bmp"].includes(e)) return "IMG";
  if(["zip","rar","7z"].includes(e)) return "ZIP";
  return e ? e.slice(0,4).toUpperCase() : "ARQ";
}
/* O Storage só aceita estes caracteres no caminho; o nome original fica no banco. */
function caminhoSeguro(contaId, nome){
  const ext = extensaoDe(nome);
  const base = nome.replace(/\.[^.]+$/, "")
    .replace(/[^a-zA-Z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "arquivo";
  return "contas/" + contaId + "/" + uid().slice(0, 8) + "-" + base + (ext ? "." + ext : "");
}

function traduzErroLogin(error){
  const m = String(error && error.message || "").toLowerCase();
  if(m.includes("invalid login")) return "E-mail ou senha incorretos.";
  if(m.includes("email not confirmed")) return "E-mail ainda não confirmado. O gerente confirma no painel do Supabase, em Authentication → Users.";
  if(m.includes("failed to fetch") || m.includes("network")) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if(m.includes("rate limit") || m.includes("too many")) return "Muitas tentativas seguidas. Aguarde um minuto e tente de novo.";
  return "Não foi possível entrar: " + (error && error.message || "erro desconhecido");
}

async function iniciarAuth(){

  if(!window.supabase || !window.supabase.createClient){
    telaPortao('<h2>Biblioteca não carregou</h2><p class="intro">O navegador não conseguiu baixar o cliente do Supabase. Verifique a conexão e recarregue a página.</p>');

    else { Auth.uid = null; Auth.perfil = null; Store.desligar(); telaLogin(); }
  });

  const { data } = await sb.auth.getSession();

let carregando = false;
async function entrou(user){
  if(Auth.uid === user.id && Auth.perfil) return;

  const { data: perfil, error } = await sb.from("perfis").select("*").eq("id", user.id).maybeSingle();

  if(error){

      '<button class="portao-btn" id="sair-3">Sair</button>');

  document.getElementById("quem-av").textContent = iniciais(perfil.nome);

}

/* ============================================================
   5. Dados — Supabase com atualização em tempo real
   ============================================================ */
const Store = {
  contas:new Map(), atividades:new Map(), interacoes:new Map(), perfis:new Map(), anexos:new Map(),
  canal:null, pronto:false,

  async iniciar(){
    await this.carregar();
    this.ligarTempoReal();
  },
  desligar(){
    if(this.canal){ sb.removeChannel(this.canal); this.canal = null; }
    this.contas.clear(); this.atividades.clear(); this.interacoes.clear(); this.perfis.clear();
    this.pronto = false;
  },
  async carregar(){
    const [p, c, a, i, x] = await Promise.all([
      sb.from("perfis").select("*"),
      sb.from("contas").select("*"),
      sb.from("atividades").select("*"),
      sb.from("interacoes").select("*"),
      sb.from("anexos").select("*")
    ]);
    const falha = [p,c,a,i].find(r => r.error);
    if(falha){ toast("Não foi possível carregar os dados: " + falha.error.message); return; }
    this.perfis     = new Map((p.data||[]).map(r => [r.id, r]));
    this.contas     = new Map((c.data||[]).map(r => [r.id, contaDoBanco(r)]));
    this.atividades = new Map((a.data||[]).map(r => [r.id, ativDoBanco(r)]));
    this.interacoes = new Map((i.data||[]).map(r => [r.id, intDoBanco(r)]));
    /* anexos falham silenciosamente se a migração ainda não rodou: a aba
       avisa por conta própria, em vez de derrubar o carregamento inteiro */
    this.anexosOk = !x.error;
    this.anexos = new Map(((x.error ? [] : x.data) || []).map(r => [r.id, anexoDoBanco(r)]));
    this.pronto = true;
    montarFiltroResponsavel();
    render();
  },
  ligarTempoReal(){
    if(this.canal) return;
    const aplica = (mapa, transforma) => payload => {
      if(payload.eventType === "DELETE"){ mapa.delete(payload.old.id); }
      else { mapa.set(payload.new.id, transforma(payload.new)); }
      render();
    };
    this.canal = sb.channel("crm-tempo-real")
      .on("postgres_changes", {event:"*", schema:"public", table:"contas"},     aplica(this.contas, contaDoBanco))
      .on("postgres_changes", {event:"*", schema:"public", table:"atividades"}, aplica(this.atividades, ativDoBanco))
      .on("postgres_changes", {event:"*", schema:"public", table:"interacoes"}, aplica(this.interacoes, intDoBanco))
      .on("postgres_changes", {event:"*", schema:"public", table:"anexos"},     aplica(this.anexos, anexoDoBanco))
      .subscribe();
  },

  async salvarConta(c){
    this.contas.set(c.id, c); render();
    const { error } = await sb.from("contas").upsert(contaParaBanco(c));
    if(error){ toast("A conta não foi salva: " + error.message); this.carregar(); }
  },
  async excluirConta(id){
    /* o banco apaga em cascata as linhas filhas, mas os arquivos no
       Storage não saem sozinhos — têm de ser removidos aqui */
    const caminhos = [...this.anexos.values()].filter(a => a.contaId === id).map(a => a.caminho);
    this.contas.delete(id);
    [...this.atividades.values()].filter(a => a.contaId === id).forEach(a => this.atividades.delete(a.id));
    [...this.interacoes.values()].filter(i => i.contaId === id).forEach(i => this.interacoes.delete(i.id));
    [...this.anexos.values()].filter(a => a.contaId === id).forEach(a => this.anexos.delete(a.id));
    render();
    const { error } = await sb.from("contas").delete().eq("id", id);
    if(error){ toast("A conta não foi excluída: " + error.message); this.carregar(); return; }
    if(caminhos.length) await sb.storage.from(BUCKET).remove(caminhos);
  },
  async salvarAtividade(a){
    this.atividades.set(a.id, a); render();
    const { error } = await sb.from("atividades").upsert(ativParaBanco(a));
    if(error){ toast("A atividade não foi salva: " + error.message); this.carregar(); }
  },
  async excluirAtividade(id){
    this.atividades.delete(id); render();
    const { error } = await sb.from("atividades").delete().eq("id", id);
    if(error){ toast("A atividade não foi excluída: " + error.message); this.carregar(); }
  },
  async salvarInteracao(i){
    this.interacoes.set(i.id, i); render();
    const { error } = await sb.from("interacoes").upsert(intParaBanco(i));
    if(error){ toast("A interação não foi registrada: " + error.message); this.carregar(); }
  },
  async excluirInteracao(id){
    this.interacoes.delete(id); render();
    const { error } = await sb.from("interacoes").delete().eq("id", id);
    if(error){ toast("A interação não foi excluída: " + error.message); this.carregar(); }
  },

  /* ---------- anexos ---------- */
  async enviarAnexo(contaId, file){
    const ext = extensaoDe(file.name);
    if(EXT_BLOQUEADAS.includes(ext)){
      toast("Arquivos ." + ext + " não são aceitos por segurança."); return false;
    }
    if(file.size > TAMANHO_MAX){
      toast("“"+file.name+"” tem "+tamanhoLegivel(file.size)+". O limite é 25 MB."); return false;
    }
    const caminho = caminhoSeguro(contaId, file.name);
    const env = await sb.storage.from(BUCKET).upload(caminho, file, {
      contentType: file.type || "application/octet-stream", upsert: false
    });
    if(env.error){
      toast(env.error.message && /bucket/i.test(env.error.message)
        ? "O espaço de anexos ainda não foi criado no Supabase. Rode a migração de anexos."
        : "Falha ao enviar “"+file.name+"”: " + env.error.message);
      return false;
    }
    const linha = {id:uid(), conta_id:contaId, nome:file.name, caminho:caminho,
                   tamanho:file.size, tipo:file.type || "", criado_por:Auth.uid};
    const { error } = await sb.from("anexos").insert(linha);
    if(error){
      await sb.storage.from(BUCKET).remove([caminho]);   // não deixa arquivo órfão
      toast("O arquivo não pôde ser registrado: " + error.message);
      return false;
    }
    this.anexos.set(linha.id, anexoDoBanco(linha));
    return true;
  },
  async baixarAnexo(a){
    const { data, error } = await sb.storage.from(BUCKET)
      .createSignedUrl(a.caminho, 60, {download: a.nome});
    if(error || !data){ toast("Não foi possível abrir o arquivo: " + (error ? error.message : "link não gerado")); return; }
    const link = document.createElement("a");
    link.href = data.signedUrl; link.rel = "noopener";
    document.body.appendChild(link); link.click(); link.remove();
  },
  async excluirAnexo(a){
    this.anexos.delete(a.id); render();
    const r1 = await sb.from("anexos").delete().eq("id", a.id);
    if(r1.error){ toast("Não foi possível excluir: " + r1.error.message); this.carregar(); return; }
    await sb.storage.from(BUCKET).remove([a.caminho]);
    toast("Anexo excluído.");
  },
  async limparExemplos(){
    const ids = [...this.contas.values()].filter(c => c.exemplo).map(c => c.id);
    if(!ids.length) return;
    ids.forEach(id => this.contas.delete(id));
    [...this.atividades.values()].filter(a => ids.includes(a.contaId)).forEach(a => this.atividades.delete(a.id));
    [...this.interacoes.values()].filter(i => ids.includes(i.contaId)).forEach(i => this.interacoes.delete(i.id));
    render();
    const { error } = await sb.from("contas").delete().in("id", ids);
    if(error){ toast("Não foi possível remover os exemplos: " + error.message); this.carregar(); return; }
    toast("Registros de exemplo removidos.");
  },
  nomeDe(id){
    const p = this.perfis.get(id);
    return p ? p.nome : "";
  }
};

  })));

    id:uid(), contaId:ids[a.i], tipo:a.tipo, data:dRel(a.dias), hora:a.hora || "",

    id:uid(), contaId:ids[e.i], tipo:e.tipo, data:dRel(e.dias), resumo:e.resumo, exemplo:true
  }));

  let r = await sb.from("contas").insert(contas);

  r = await sb.from("atividades").insert(ativs);

const UI = { view:"funil", busca:"", fStatus:"ativos", fResp:"", fTag:"", aberta:null, aba:"dados",
             arrastando:null, novaConta:false, concluindo:null, semana:0, mes:0,
             relTipo:"semana", relOffset:0 };

function contasVisiveis(){
  const q = UI.busca.trim().toLowerCase();
  return [...Store.contas.values()].filter(c => {
    if(UI.fStatus === "ativos" && c.status !== "ativo") return false;
    if(["ganho","perdido","congelado"].includes(UI.fStatus) && c.status !== UI.fStatus) return false;
    if(UI.fResp && c.responsavel !== UI.fResp) return false;
    if(UI.fTag === "__sem__" ? !!c.tag : (UI.fTag && c.tag !== UI.fTag)) return false;
    if(q){
      const alvo = [c.empresa,c.contatoNome,c.setor,c.decisorNome,c.cnpj,c.notas].join(" ").toLowerCase();
      if(!alvo.includes(q)) return false;
    }
    return true;
  });
}
const chaveQuando = a => String(a.data||"9999-12-31") + " " + String(a.hora || "23:59");
function atividadesDe(id){ return [...Store.atividades.values()].filter(a => a.contaId === id).sort((x,y) => chaveQuando(x).localeCompare(chaveQuando(y))); }
function pendentesDe(id){ return atividadesDe(id).filter(a => a.status !== "concluida"); }
function proximaAtividade(id){ return pendentesDe(id)[0] || null; }
function interacoesDe(id){ return [...Store.interacoes.values()].filter(i => i.contaId === id).sort((a,b) => String(b.data).localeCompare(String(a.data))); }
function anexosDe(id){ return [...Store.anexos.values()].filter(a => a.contaId === id).sort((a,b) => String(b.criadoEm).localeCompare(String(a.criadoEm))); }
function progressoEtapa(c){
  const et = ETAPA[c.etapa]; if(!et) return 0;
  const marcas = (c.checklist && c.checklist[c.etapa]) || [];
  return Math.round(et.criterios.filter((_,i) => marcas[i]).length / et.criterios.length * 100);
}
function pendentesGlobais(){
  return [...Store.atividades.values()].filter(a => a.status !== "concluida" && Store.contas.has(a.contaId))
    .sort((x,y) => chaveQuando(x).localeCompare(chaveQuando(y)));
}
function totalAtrasadas(){
  return pendentesGlobais().filter(a => {
    const c = Store.contas.get(a.contaId);
    return c && c.status === "ativo" && diasAte(a.data) < 0;
  }).length;
}
/* ---------- períodos e apuração das metas ---------- */
function inicioSemana(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));   // segunda-feira
  return x;
}
function somaDias(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function inicioMes(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(1); return x; }
function proximoMes(d){ const x = inicioMes(d); x.setMonth(x.getMonth()+1); return x; }
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

/* Base de apuração: contas reais, respeitando os filtros de responsável e tag. */
function baseApuracao(){
  return [...Store.contas.values()].filter(c => !c.exemplo
    && (!UI.fResp || c.responsavel === UI.fResp)
    && (UI.fTag === "__sem__" ? !c.tag : (!UI.fTag || c.tag === UI.fTag)));
}

/* Conta os eventos de um período [ini, fim). */
function apurar(ini, fim){
  const base = baseApuracao();
  const ids = new Set(base.map(c => c.id));
  const dentro = s => { const d = parseISO(s); return !!d && d >= ini && d < fim; };
  const transicoes = alvo => [...Store.interacoes.values()]
    .filter(i => ids.has(i.contaId) && i.etapaPara === alvo && dentro(i.data)).length;
  /* A reunião é medida pelo movimento no funil, não pela agenda.
     Qualquer SAÍDA do Agendamento para uma etapa adiante significa que a
     reunião aconteceu — inclusive quando o lead pula a Maturação e vai
     direto para Negociação, ou é fechado na sequência. */
  const posicao = k => ETAPAS.findIndex(x => x.k === k);
  const saiuDoAgendamento = [...Store.interacoes.values()].filter(i =>
    ids.has(i.contaId) && dentro(i.data) &&
    i.etapaDe === "agendamento" && posicao(i.etapaPara) > posicao("agendamento")).length;
  /* reunião que aconteceu mas a conta morreu no Agendamento */
  const reunioesSemAvanco = base.filter(c => dentro(c.reuniaoEm)).length;
  return {
    prospeccoes:  base.filter(c => dentro(c.criadoEm)).length,
    conexoes:     transicoes("conexao"),
    agendamentos: transicoes("agendamento"),
    reunioes:     saiuDoAgendamento + reunioesSemAvanco,
    negociacoes:  transicoes("negociacao"),
    fechamentos:  base.filter(c => c.status === "ganho" && dentro(c.fechadaEm)).length
  };
}

function renderFunil(){
  const lista = contasVisiveis();
  const porEtapa = Object.fromEntries(ETAPAS.map(e => [e.k, []]));
  lista.forEach(c => { if(porEtapa[c.etapa]) porEtapa[c.etapa].push(c); });
  ETAPAS.forEach(e => porEtapa[e.k].sort((a,b) => {
    const pa = proximaAtividade(a.id), pb = proximaAtividade(b.id);
    const da = pa ? diasAte(pa.data) : null, dbb = pb ? diasAte(pb.data) : null;
    if(da === null && dbb === null) return (b.entregasMes||0)-(a.entregasMes||0);
    if(da === null) return -1; if(dbb === null) return 1;
    return da - dbb;
  }));

  if(!Store.contas.size){
    app.innerHTML = '<div class="page"><div class="vazio">' +
      '<strong style="color:var(--ink);display:block;margin-bottom:6px">O funil está vazio</strong>' +
      'Cadastre a primeira conta em <strong>+ Nova conta</strong>, ou carregue um conjunto de exemplo para ver como o quadro funciona.' +
      '<br><button class="btn" id="carregar-ex">Carregar 8 contas de exemplo</button></div></div>';
    document.getElementById("carregar-ex").onclick = carregarExemplos;
    return;
  }

  const faixa = ETAPAS.map(e => {
    const cs = porEtapa[e.k], val = cs.reduce((s,c) => s+(Number(c.entregasMes)||0), 0);
    return '<div class="funil-item" style="--st:'+e.cor+'">' +
      '<span class="funil-nome">'+esc(e.nome)+'</span>' +
      '<span class="funil-valor">'+(val ? numCurto(val) : "—")+'</span>' +
      '<span class="funil-qtd">'+(val ? "entregas/mês · " : "")+cs.length+(cs.length===1?" conta":" contas")+'</span></div>';
  }).join("");

  const colunas = ETAPAS.map(e => {
    const cs = porEtapa[e.k];
    const val = cs.reduce((s,c) => s+(Number(c.entregasMes)||0), 0);
    const lojas = cs.reduce((s,c) => s+(Number(c.lojas)||0), 0);
    const corpo = cs.length ? cs.map(c => cardHTML(c,e)).join("") : '<div class="col-empty">Nenhuma conta nesta etapa</div>';
    return '<section class="col" data-etapa="'+e.k+'" style="--st:'+e.cor+'">' +
      '<header class="col-head"><span class="col-dot"></span><h3>'+esc(e.nome)+'</h3>' +
      '<span class="col-count mono">'+cs.length+'</span></header>' +
      '<div class="col-body">'+corpo+'</div>' +
      '<footer class="col-total"><span>'+(val?numCurto(val)+" entregas":"—")+'</span><span>'+(lojas?num(lojas)+" lojas":"")+'</span></footer></section>';
  }).join("");

  app.innerHTML = '<div class="funil">'+faixa+'</div><div class="board">'+colunas+'</div>';
  ligarQuadro();
}

function cardHTML(c, e){
  const prox = proximaAtividade(c.id);
  let chipPrazo = "", linhaAtiv = "";
  if(c.status === "ativo"){
    if(prox){
      const d = diasAte(prox.data);
      linhaAtiv = '<span class="card-ativ" style="--at:'+corDe(prox.tipo)+'"><i></i>' +
        '<b>'+esc(prox.tipo)+'</b><span>'+esc(prox.descricao || "")+'</span></span>';
      if(d < 0) chipPrazo = '<span class="chip atraso">'+Math.abs(d)+' d em atraso</span>';
      else if(d === 0) chipPrazo = '<span class="chip hoje">Hoje'+(prox.hora ? " "+esc(prox.hora) : "")+'</span>';
      else chipPrazo = '<span class="chip">'+fmtData(prox.data)+(prox.hora ? " "+esc(prox.hora) : "")+'</span>';
    } else {
      chipPrazo = '<span class="chip atraso">Sem atividade agendada</span>';
    }
  }
  const chipStatus = c.status === "ganho" ? '<span class="chip won">Ganha</span>'
    : c.status === "perdido" ? '<span class="chip" style="color:var(--st-perdido)">Perdida</span>'
    : c.status === "congelado" ? '<span class="chip">Congelada</span>' : "";
  const dono = Store.perfis.size > 1 && c.responsavel ? '<span class="chip dono">'+esc(primeiroNome(Store.nomeDe(c.responsavel)))+'</span>' : "";
  const temp = c.temperatura ? '<span class="chip" style="color:'+COR_TEMP[c.temperatura]+';border-color:currentColor;font-weight:700">'+esc(c.temperatura)+'</span>' : "";
  const tag = c.tag ? '<span class="chip tag" style="--tg:'+COR_TAG[c.tag]+'">'+esc(c.tag === "Grandes Contas" ? "Grande conta" : "Grupo regional")+'</span>' : "";
  const nAnexos = anexosDe(c.id).length;
  const clipe = nAnexos ? '<span class="chip" title="'+nAnexos+' arquivo'+(nAnexos>1?"s":"")+' anexado'+(nAnexos>1?"s":"")+'">📎 '+nAnexos+'</span>' : "";
  const linhaBase = [esc(c.setor || "Setor não informado"),
                     c.lojas ? num(c.lojas)+" lojas" : null,
                     c.praca ? esc(c.praca) : null].filter(Boolean).join(" · ");
  return '<button class="card '+(c.status !== "ativo" ? esc(c.status) : "")+'" draggable="true" data-id="'+esc(c.id)+'" style="--st:'+e.cor+'">' +
    '<span class="card-top"><span class="card-emp">'+esc(c.empresa)+'</span>' +
    '<span class="card-num">'+numCurto(c.entregasMes)+'<small>entregas/mês</small></span></span>' +
    '<span class="card-meta">'+esc(c.contatoNome || "Contato não definido")+
      (c.contatoCargo ? ' · '+esc(c.contatoCargo) : "")+'<br>'+linhaBase+'</span>' +
    linhaAtiv +
    '<span class="card-prog"><i style="width:'+progressoEtapa(c)+'%"></i></span>' +
    '<span class="card-foot">'+chipPrazo+tag+temp+clipe+chipStatus+dono+(c.exemplo ? '<span class="chip ex">exemplo</span>' : "")+'</span></button>';
}

function ligarQuadro(){
  app.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => abrir(el.dataset.id));
    el.addEventListener("dragstart", ev => {
      UI.arrastando = el.dataset.id; el.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      try { ev.dataTransfer.setData("text/plain", el.dataset.id); } catch(x){}
    });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); UI.arrastando = null;
      app.querySelectorAll(".col.drop").forEach(c => c.classList.remove("drop")); });
  });
  app.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; col.classList.add("drop"); });
    col.addEventListener("dragleave", ev => { if(!col.contains(ev.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop", ev => {
      ev.preventDefault(); col.classList.remove("drop");
      const id = UI.arrastando || (ev.dataTransfer && ev.dataTransfer.getData("text/plain"));
      if(id) moverEtapa(id, col.dataset.etapa);
    });
  });
}

/* Registra a mudança de etapa como evento datado. TODO caminho que muda
   c.etapa precisa passar por aqui: é isto que as Metas e o Relatório
   contam. Mexer na etapa sem chamar esta função move o card no quadro e
   deixa o avanço invisível para os indicadores. */
function registrarEtapa(conta, de, para){
  if(!de || !para || de === para) return;
  const nomeDe = ETAPA[de] ? ETAPA[de].nome : de;
  const nomePara = ETAPA[para] ? ETAPA[para].nome : para;
  Store.salvarInteracao({id:uid(), contaId:conta.id, tipo:"Nota interna", data:hojeISO(),
    etapaDe:de, etapaPara:para,
    resumo:"Etapa alterada: "+nomeDe+" → "+nomePara+" (por "+primeiroNome(Auth.perfil.nome)+")"});
}

function moverEtapa(id, etapa){
  const c = Store.contas.get(id);
  if(!c || c.etapa === etapa) return;
  const etapaAnterior = c.etapa;
  c.etapa = etapa; c.probabilidade = ETAPA[etapa].prob; c.entradaEtapa = hojeISO();
  Store.salvarConta(c);
  registrarEtapa(c, etapaAnterior, etapa);
  toast(c.empresa+" → "+ETAPA[etapa].nome);
}

function renderAgenda(){
  const visiveis = new Set(contasVisiveis().map(c => c.id));
  const pend = pendentesGlobais().filter(a => visiveis.has(a.contaId));
  const grupos = [
    {t:"Em atraso", d:"Passou da data combinada — retome hoje.", f:a => diasAte(a.data) < 0},
    {t:"Hoje", d:"", f:a => diasAte(a.data) === 0},
    {t:"Próximos 7 dias", d:"", f:a => { const d = diasAte(a.data); return d > 0 && d <= 7; }},
    {t:"Depois", d:"", f:a => diasAte(a.data) > 7}
  ];
  let html = '<div class="page">';
  let algum = false;
  grupos.forEach(g => {
    const as = pend.filter(g.f);
    if(!as.length) return;
    algum = true;
    html += '<section class="grupo"><div class="grupo-head"><h3>'+esc(g.t)+'</h3><span class="eyebrow">'+as.length+'</span></div>' +
      (g.d ? '<p style="margin:-4px 0 9px;font-size:12px;color:var(--ink-3)">'+esc(g.d)+'</p>' : "") +
      '<div class="lista">' + as.map(a => {
        const c = Store.contas.get(a.contaId), e = ETAPA[c.etapa] || ETAPAS[0];
        const dono = Store.perfis.size > 1 && c.responsavel ? " · " + primeiroNome(Store.nomeDe(c.responsavel)) : "";
        return '<div class="linha" style="--at:'+corDe(a.tipo)+'">' +
          '<span class="l-data">'+fmtData(a.data)+'<small>'+esc(a.hora || "sem hora")+'</small></span>' +
          '<span class="l-tipo"><i></i>'+esc(a.tipo)+'</span>' +
          '<button class="l-emp" data-id="'+esc(c.id)+'">'+esc(c.empresa)+'<small>'+esc(e.nome)+' · '+num(c.lojas)+' lojas'+esc(dono)+'</small></button>' +
          '<span class="l-desc">'+esc(a.descricao || "—")+'</span>' +
          '<span class="l-acao"><button class="btn btn-sm" data-concluir="'+esc(a.id)+'">Concluir</button></span></div>';
      }).join("") + '</div></section>';
  });

  const semAtividade = contasVisiveis().filter(c => c.status === "ativo" && pendentesDe(c.id).length === 0);
  if(semAtividade.length){
    algum = true;
    html += '<section class="grupo"><div class="grupo-head"><h3>Contas sem atividade agendada</h3><span class="eyebrow">'+semAtividade.length+'</span></div>' +
      '<p style="margin:-4px 0 9px;font-size:12px;color:var(--ink-3)">Conta em aberto sem próximo passo marcado. É aqui que o funil vaza.</p>' +
      '<div class="lista">' + semAtividade.map(c => {
        const e = ETAPA[c.etapa] || ETAPAS[0];
        return '<div class="linha" style="--at:var(--danger)">' +
          '<span class="l-data">—</span>' +
          '<span class="l-tipo"><i></i>Nada marcado</span>' +
          '<button class="l-emp" data-id="'+esc(c.id)+'">'+esc(c.empresa)+'<small>'+esc(e.nome)+' · '+num(c.lojas)+' lojas</small></button>' +
          '<span class="l-desc">'+numCurto(c.entregasMes)+' entregas/mês de potencial</span>' +
          '<span class="l-acao"><button class="btn btn-sm" data-agendar="'+esc(c.id)+'">Agendar</button></span></div>';
      }).join("") + '</div></section>';
  }

  if(!algum) html += '<div class="vazio">Nenhuma atividade pendente com os filtros atuais.</div>';
  app.innerHTML = html + '</div>';

  app.querySelectorAll(".l-emp").forEach(el => el.onclick = () => abrir(el.dataset.id));
  app.querySelectorAll("[data-concluir]").forEach(b => b.onclick = () => {
    const a = Store.atividades.get(b.dataset.concluir);
    if(a) concluirAtividade(a, a.descricao || a.tipo);
  });
  app.querySelectorAll("[data-agendar]").forEach(b => b.onclick = () => { abrir(b.dataset.agendar); UI.aba = "atividades"; renderDrawer(); });
}

function concluirAtividade(a, resumo){
  a.status = "concluida"; a.concluidaEm = hojeISO();
  Store.salvarAtividade(a);
  Store.salvarInteracao({id:uid(), contaId:a.contaId, tipo:a.tipo, data:hojeISO(),
    resumo:(resumo || a.descricao || a.tipo) + " — " + primeiroNome(Auth.perfil.nome)});
  UI.concluindo = null;
  const restantes = pendentesDe(a.contaId).length;
  const conta = Store.contas.get(a.contaId);
  toast(restantes ? "Registrado no histórico."
    : "Registrado. "+(conta ? conta.empresa : "A conta")+" ficou sem próxima atividade — agende agora.");
}

/* ---------- Metas ---------- */
function cartaoMeta(def, feito, esperado, corrente){
  const pct = Math.min(100, Math.round(feito / def.meta * 100));
  const batida = feito >= def.meta;
  const atras = corrente && !batida && feito < esperado;
  const cor = batida ? "var(--ok)" : atras ? "var(--danger)" : "var(--mel-2)";
  const situacao = batida ? "Meta batida"
    : corrente ? (atras ? "Faltam " + (def.meta - feito) + " · abaixo do ritmo"
                        : "Faltam " + (def.meta - feito) + " · no ritmo")
    : "Fechou em " + feito + " de " + def.meta;
  return '<div class="meta-card'+(batida?" ok":atras?" atras":"")+'">' +
    '<div class="eyebrow">'+esc(def.nome)+'</div>' +
    '<div class="meta-num"><b>'+feito+'</b><span>/ '+def.meta+'</span></div>' +
    '<div class="meta-trilho"><i style="width:'+pct+'%;background:'+cor+'"></i>' +
      (corrente && !batida ? '<u style="left:'+Math.min(100, esperado/def.meta*100)+'%"></u>' : "") +
    '</div>' +
    '<div class="meta-sit" style="color:'+(batida?"var(--ok)":atras?"var(--danger)":"var(--ink-2)")+'">'+esc(situacao)+'</div>' +
    '<div class="meta-desc">'+esc(def.desc)+'</div></div>';
}

function renderMetas(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);

  // --- semana ---
  const iniSem = somaDias(inicioSemana(hoje), UI.semana * 7);
  const fimSem = somaDias(iniSem, 7);
  const semanaCorrente = UI.semana === 0;
  const diaUtil = Math.min(5, Math.max(0, (hoje.getDay() === 0 ? 5 : Math.min(hoje.getDay(), 5))));
  const ritmoSem = semanaCorrente ? diaUtil / 5 : 1;
  const som = apurar(iniSem, fimSem);

  // --- mês ---
  const iniMes = inicioMes(new Date(hoje.getFullYear(), hoje.getMonth() + UI.mes, 1));
  const fimMes = proximoMes(iniMes);
  const mesCorrente = UI.mes === 0;
  const diasNoMes = Math.round((fimMes - iniMes) / 86400000);
  const ritmoMes = mesCorrente ? hoje.getDate() / diasNoMes : 1;
  const mesa = apurar(iniMes, fimMes);

  const quem = UI.fResp ? Store.nomeDe(UI.fResp) : "toda a equipe";
  const faixa = fmtData(iso(iniSem)) + " a " + fmtData(iso(somaDias(fimSem, -1)));

  // --- histórico de 8 semanas ---
  const colunas = [];
  for(let k = 7; k >= 0; k--){
    const i = somaDias(inicioSemana(hoje), -k * 7);
    colunas.push({rot:String(i.getDate()).padStart(2,"0")+"/"+String(i.getMonth()+1).padStart(2,"0"),
                  dados:apurar(i, somaDias(i, 7)), atual:k === 0});
  }
  const histLinhas = METAS_SEMANA.map(d =>
    '<tr><th>'+esc(d.nome)+'</th>' + colunas.map(col => {
      const v = col.dados[d.k], pct = Math.min(100, v / d.meta * 100);
      const cls = v >= d.meta ? "ok" : v > 0 ? "parcial" : "zero";
      return '<td'+(col.atual?' class="atual"':"")+'><span class="hcel '+cls+'" ' +
        'style="--h:'+Math.max(6, pct)+'%" title="'+v+' de '+d.meta+'"></span><em>'+v+'</em></td>';
    }).join("") + '</tr>').join("");

  app.innerHTML = '<div class="page">' +
    '<div class="metas-head">' +
      '<div><h2>Metas semanais</h2>' +
        '<p class="metas-sub">Semana de '+esc(faixa)+' · '+esc(quem)+'</p></div>' +
      '<div class="metas-nav">' +
        '<button class="btn btn-sm" data-sem="-1" aria-label="Semana anterior">◀</button>' +
        (semanaCorrente ? '' : '<button class="btn btn-sm" data-sem="0">Semana atual</button>') +
        '<button class="btn btn-sm" data-sem="1" aria-label="Próxima semana"'+(semanaCorrente?" disabled":"")+'>▶</button>' +
      '</div></div>' +
    '<div class="meta-grid">' +
      METAS_SEMANA.map(d => cartaoMeta(d, som[d.k], d.meta * ritmoSem, semanaCorrente)).join("") +
    '</div>' +

    '<div class="metas-head" style="margin-top:30px">' +
      '<div><h2>Metas mensais</h2>' +
        '<p class="metas-sub">'+esc(MESES[iniMes.getMonth()])+' de '+iniMes.getFullYear()+' · '+esc(quem)+'</p></div>' +
      '<div class="metas-nav">' +
        '<button class="btn btn-sm" data-mes="-1" aria-label="Mês anterior">◀</button>' +
        (mesCorrente ? '' : '<button class="btn btn-sm" data-mes="0">Mês atual</button>') +
        '<button class="btn btn-sm" data-mes="1" aria-label="Próximo mês"'+(mesCorrente?" disabled":"")+'>▶</button>' +
      '</div></div>' +
    '<div class="meta-grid dois">' +
      METAS_MES.map(d => cartaoMeta(d, mesa[d.k], d.meta * ritmoMes, mesCorrente)).join("") +
    '</div>' +

    '<div class="painel" style="margin-top:30px"><h3>Últimas 8 semanas</h3>' +
      '<p class="desc">Cada coluna é uma semana, da segunda ao domingo. Barra cheia = meta batida.</p>' +
      '<div style="overflow-x:auto"><table class="meta-hist"><thead><tr><th></th>' +
        colunas.map(c => '<th'+(c.atual?' class="atual"':"")+'>'+esc(c.rot)+'</th>').join("") +
      '</tr></thead><tbody>'+histLinhas+'</tbody></table></div></div>' +

    '<p class="metas-nota">As metas contam eventos com data, e as de reunião vêm do movimento no funil: ' +
      'entrar no Agendamento conta como reunião agendada; sair do Agendamento para qualquer etapa adiante ' +
      'conta como realizada, mesmo pulando a Maturação. ' +
      'Conta perdida no Agendamento cujo hunter confirmou que a reunião ocorreu também entra como realizada. ' +
      'Só passa a contar o que acontece dentro do CRM — movimentos feitos antes da implantação não aparecem aqui. ' +
      'Contas de exemplo são ignoradas.</p>' +
    '</div>';

  app.querySelectorAll("[data-sem]").forEach(b => b.onclick = () => {
    const v = Number(b.dataset.sem);
    UI.semana = v === 0 ? 0 : Math.min(0, UI.semana + v);
    render();
  });
  app.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => {
    const v = Number(b.dataset.mes);
    UI.mes = v === 0 ? 0 : Math.min(0, UI.mes + v);
    render();
  });
}

/* ---------- Relatório ---------- */
function periodoRelatorio(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(UI.relTipo === "semana"){
    const ini = somaDias(inicioSemana(hoje), UI.relOffset * 7);
    const fim = somaDias(ini, 7);
    return {ini, fim, corrente:UI.relOffset === 0,
            titulo:"Semana de " + fmtData(iso(ini)) + " a " + fmtData(iso(somaDias(fim, -1))),
            semanas:1};
  }
  const ini = inicioMes(new Date(hoje.getFullYear(), hoje.getMonth() + UI.relOffset, 1));
  const fim = proximoMes(ini);
  let semanas = 0;
  for(let d = new Date(ini); d < fim; d = somaDias(d, 1)) if(d.getDay() === 1) semanas++;
  return {ini, fim, corrente:UI.relOffset === 0,
          titulo:MESES[ini.getMonth()].charAt(0).toUpperCase() + MESES[ini.getMonth()].slice(1) + " de " + ini.getFullYear(),
          semanas:semanas || 4};
}

function renderRelatorio(){
  const P = periodoRelatorio();
  const base = baseApuracao();
  const ids = new Set(base.map(c => c.id));
  const dentro = s => { const d = parseISO(s); return !!d && d >= P.ini && d < P.fim; };
  const A = apurar(P.ini, P.fim);

  const novas    = base.filter(c => dentro(c.criadoEm)).sort((a,b) => String(a.criadoEm).localeCompare(String(b.criadoEm)));
  const ganhas   = base.filter(c => c.status === "ganho"   && dentro(c.fechadaEm));
  const perdidas = base.filter(c => c.status === "perdido" && dentro(c.perdidaEm));
  const movs = [...Store.interacoes.values()]
    .filter(i => ids.has(i.contaId) && i.etapaPara && dentro(i.data))
    .sort((a,b) => String(a.data).localeCompare(String(b.data)));
  const ativsPeriodo = [...Store.atividades.values()].filter(a => ids.has(a.contaId));
  const registros = [...Store.interacoes.values()]
    .filter(i => ids.has(i.contaId) && !i.etapaPara && dentro(i.data));

  const quem = UI.fResp ? Store.nomeDe(UI.fResp) : "toda a equipe";
  const recorte = UI.fTag === "__sem__" ? "Sem classificação" : (UI.fTag || "Grandes Contas e Grupos Regionais");

  /* --- 1. metas --- */
  const linhasMeta = def => {
    const alvo = UI.relTipo === "mes" && METAS_SEMANA.indexOf(def) >= 0 ? def.meta * P.semanas : def.meta;
    const feito = A[def.k], pct = Math.round(feito / alvo * 100);
    const ok = feito >= alvo;
    return '<tr><td>'+esc(def.nome)+'</td>' +
      '<td class="n">'+alvo+'</td><td class="n"><strong>'+feito+'</strong></td>' +
      '<td class="n">'+pct+'%</td>' +
      '<td><span class="selo '+(ok?"ok":pct>=70?"quase":"nao")+'">'+(ok?"batida":pct>=70?"perto":"não batida")+'</span></td></tr>';
  };
  const metasDoPeriodo = UI.relTipo === "semana"
    ? METAS_SEMANA.map(linhasMeta).join("")
    : METAS_SEMANA.map(linhasMeta).join("") + METAS_MES.map(linhasMeta).join("");

  /* --- 2. atividades --- */
  const linhasAtiv = TIPOS_ATIVIDADE.map(t => {
    const doTipo = ativsPeriodo.filter(a => a.tipo === t.k);
    const marcadas = doTipo.filter(a => dentro(a.criadoEm)).length;
    const feitas = doTipo.filter(a => a.status === "concluida" && dentro(a.concluidaEm)).length;
    const vencidas = doTipo.filter(a => a.status !== "concluida" && dentro(a.data)).length;
    if(!marcadas && !feitas && !vencidas) return "";
    return '<tr><td><span class="pt" style="background:'+t.cor+'"></span>'+esc(t.k)+'</td>' +
      '<td class="n">'+marcadas+'</td><td class="n">'+feitas+'</td>' +
      '<td class="n'+(vencidas?" alerta":"")+'">'+vencidas+'</td></tr>';
  }).join("");
  const totMarc = ativsPeriodo.filter(a => dentro(a.criadoEm)).length;
  const totFeit = ativsPeriodo.filter(a => a.status === "concluida" && dentro(a.concluidaEm)).length;
  const totVenc = ativsPeriodo.filter(a => a.status !== "concluida" && dentro(a.data)).length;

  /* --- 3. movimentações --- */
  const movHTML = movs.length ? movs.map(m => {
    const c = Store.contas.get(m.contaId);
    const de = ETAPA[m.etapaDe], para = ETAPA[m.etapaPara];
    return '<tr><td class="mono">'+fmtData(m.data)+'</td>' +
      '<td>'+esc(c ? c.empresa : "—")+'</td>' +
      '<td><span style="color:var(--ink-3)">'+esc(de ? de.nome : "—")+'</span>' +
      ' <span style="color:var(--ink-3)">→</span> ' +
      '<strong style="color:'+(para?para.cor:"var(--ink)")+'">'+esc(para ? para.nome : m.etapaPara)+'</strong></td></tr>';
  }).join("") : '<tr><td colspan="3" class="vaziot">Nenhuma mudança de etapa no período.</td></tr>';

  const avancos = movs.filter(m => {
    const i = ETAPAS.findIndex(x => x.k === m.etapaDe), j = ETAPAS.findIndex(x => x.k === m.etapaPara);
    return i >= 0 && j > i;
  }).length;
  const recuos = movs.length - avancos;

  /* --- 4. contas novas --- */
  const novasHTML = novas.length ? novas.map(c =>
    '<tr><td class="mono">'+fmtData(c.criadoEm)+'</td><td>'+esc(c.empresa)+'</td>' +
    '<td>'+esc(c.tag || "—")+'</td><td class="n">'+num(c.lojas)+'</td>' +
    '<td class="n">'+num(c.entregasMes)+'</td></tr>').join("")
    : '<tr><td colspan="5" class="vaziot">Nenhuma conta nova no período.</td></tr>';

  /* --- 5. desfechos --- */
  const desfechos = (ganhas.map(c =>
      '<tr><td class="mono">'+fmtData(c.fechadaEm)+'</td><td>'+esc(c.empresa)+'</td>' +
      '<td><span class="selo ok">ganha</span></td><td>'+num(c.entregasMes)+' entregas/mês</td></tr>').join("") +
    perdidas.map(c =>
      '<tr><td class="mono">'+fmtData(c.perdidaEm)+'</td><td>'+esc(c.empresa)+'</td>' +
      '<td><span class="selo nao">perdida</span></td><td>'+esc(c.motivoPerda || "Motivo não informado")+'</td></tr>').join(""))
    || '<tr><td colspan="4" class="vaziot">Nenhum fechamento nem perda no período.</td></tr>';

  /* --- 6. por tag --- */
  const grupos = TAGS.concat(["— sem classificação —"]);
  const tagHTML = grupos.map(g => {
    const doGrupo = base.filter(c => g.startsWith("—") ? !c.tag : c.tag === g);
    if(!doGrupo.length) return "";
    const abertas = doGrupo.filter(c => c.status === "ativo");
    const novasG = doGrupo.filter(c => dentro(c.criadoEm)).length;
    const movG = movs.filter(m => doGrupo.some(c => c.id === m.contaId)).length;
    return '<tr><td>'+esc(g)+'</td><td class="n">'+doGrupo.length+'</td><td class="n">'+abertas.length+'</td>' +
      '<td class="n">'+num(abertas.reduce((s,c) => s+(Number(c.entregasMes)||0),0))+'</td>' +
      '<td class="n">'+novasG+'</td><td class="n">'+movG+'</td></tr>';
  }).join("");

  /* --- 7. funil hoje --- */
  const funilHoje = ETAPAS.map(e => {
    const cs = base.filter(c => c.status === "ativo" && c.etapa === e.k);
    return '<tr><td><span class="pt" style="background:'+e.cor+'"></span>'+esc(e.nome)+'</td>' +
      '<td class="n">'+cs.length+'</td>' +
      '<td class="n">'+num(cs.reduce((s,c) => s+(Number(c.entregasMes)||0),0))+'</td></tr>';
  }).join("");

  app.innerHTML = '<div class="page relatorio">' +
    '<div class="rel-topo">' +
      '<div><h2>Relatório de atividade</h2>' +
        '<p class="metas-sub">'+esc(P.titulo)+' · '+esc(quem)+' · '+esc(recorte)+'</p></div>' +
      '<div class="rel-acoes">' +
        '<div class="rel-tipo">' +
          '<button class="'+(UI.relTipo==="semana"?"on":"")+'" data-tipo="semana">Semana</button>' +
          '<button class="'+(UI.relTipo==="mes"?"on":"")+'" data-tipo="mes">Mês</button>' +
        '</div>' +
        '<button class="btn btn-sm" data-off="-1" aria-label="Período anterior">◀</button>' +
        (P.corrente ? "" : '<button class="btn btn-sm" data-off="0">Atual</button>') +
        '<button class="btn btn-sm" data-off="1" aria-label="Próximo período"'+(P.corrente?" disabled":"")+'>▶</button>' +
        '<button class="btn btn-sm" id="rel-copiar">Copiar resumo</button>' +
        '<button class="btn btn-sm" id="rel-imprimir">Imprimir</button>' +
      '</div></div>' +

    '<div class="rel-fita">' +
      '<div><b>'+A.prospeccoes+'</b><span>contas novas</span></div>' +
      '<div><b>'+movs.length+'</b><span>movimentações</span></div>' +
      '<div><b>'+totFeit+'</b><span>atividades concluídas</span></div>' +
      '<div><b>'+registros.length+'</b><span>interações registradas</span></div>' +
      '<div><b>'+ganhas.length+'</b><span>fechamentos</span></div>' +
      '<div><b>'+perdidas.length+'</b><span>perdas</span></div>' +
    '</div>' +

    secao("1. Metas do período",
      UI.relTipo === "mes" ? "Metas semanais multiplicadas pelas "+P.semanas+" semanas do mês, mais as metas mensais." : "",
      '<table class="rel-tab"><thead><tr><th>Meta</th><th class="n">Alvo</th><th class="n">Realizado</th><th class="n">%</th><th>Situação</th></tr></thead><tbody>'+metasDoPeriodo+'</tbody></table>') +

    secao("2. Atividades executadas",
      "Marcadas = agendadas no período. Concluídas = executadas e registradas no histórico. Vencidas = com data no período e ainda em aberto.",
      '<table class="rel-tab"><thead><tr><th>Tipo</th><th class="n">Marcadas</th><th class="n">Concluídas</th><th class="n">Vencidas</th></tr></thead><tbody>' +
      (linhasAtiv || '<tr><td colspan="4" class="vaziot">Nenhuma atividade no período.</td></tr>') +
      '</tbody><tfoot><tr><td>Total</td><td class="n">'+totMarc+'</td><td class="n">'+totFeit+'</td><td class="n'+(totVenc?" alerta":"")+'">'+totVenc+'</td></tr></tfoot></table>') +

    secao("3. Movimentações de funil",
      movs.length ? avancos+" avanço"+(avancos===1?"":"s")+" e "+recuos+" retorno"+(recuos===1?"":"s")+" de etapa." : "",
      '<table class="rel-tab"><thead><tr><th>Data</th><th>Conta</th><th>Movimento</th></tr></thead><tbody>'+movHTML+'</tbody></table>') +

    secao("4. Contas novas", "",

    render();
  });
  document.getElementById("rel-imprimir").onclick = () => window.print();
  document.getElementById("rel-copiar").onclick = () => {
    const L = ["*Relatório — "+P.titulo+"*", quem+" · "+recorte, "",
      "*Resumo*",
      "• Contas novas: "+A.prospeccoes,
      "• Movimentações de funil: "+movs.length+" ("+avancos+" avanços)",
      "• Atividades concluídas: "+totFeit+" de "+totMarc+" marcadas",
      "• Interações registradas: "+registros.length,
      "• Fechamentos: "+ganhas.length+" · Perdas: "+perdidas.length, "", "*Metas*"];
    (UI.relTipo === "semana" ? METAS_SEMANA : METAS_SEMANA.concat(METAS_MES)).forEach(d => {
      const alvo = UI.relTipo === "mes" && METAS_SEMANA.indexOf(d) >= 0 ? d.meta * P.semanas : d.meta;
      L.push((A[d.k] >= alvo ? "✅" : "⚠️") + " " + d.nome + ": " + A[d.k] + "/" + alvo);
    });
    if(totVenc) L.push("", "⚠️ "+totVenc+" atividade"+(totVenc===1?"":"s")+" venceu sem conclusão.");
    const txt = L.join("\n");
    navigator.clipboard.writeText(txt)
      .then(() => toast("Resumo copiado. É só colar no WhatsApp ou e-mail."))
      .catch(() => toast("Não foi possível copiar. Use o botão Imprimir."));
  };

function secao(titulo, nota, corpo){

function renderIndicadores(){
  const q = UI.busca.trim().toLowerCase();
  const base = [...Store.contas.values()]
    .filter(c => !UI.fResp || c.responsavel === UI.fResp)
    .filter(c => !q || [c.empresa,c.contatoNome,c.setor].join(" ").toLowerCase().includes(q));
  const ativas = base.filter(c => c.status === "ativo");
  const ganhas = base.filter(c => c.status === "ganho");
  const perdidas = base.filter(c => c.status === "perdido");
  const soma = (arr, campo) => arr.reduce((s,c) => s+(Number(c[campo])||0), 0);

  const potencial = soma(ativas,"entregasMes");
  const ponderado = ativas.reduce((s,c) => s+(Number(c.entregasMes)||0)*((Number(c.probabilidade)||0)/100), 0);
  const ganho = soma(ganhas,"entregasMes");
  const lojasAtivas = soma(ativas,"lojas");
  const decididas = ganhas.length + perdidas.length;
  const taxa = decididas ? Math.round(ganhas.length/decididas*100) : null;
  const mediaGanha = ganhas.length ? Math.round(ganho/ganhas.length) : 0;
  const porLoja = lojasAtivas ? Math.round(potencial/lojasAtivas) : 0;
  const atrasadas = totalAtrasadas();
  const ciclos = ganhas.map(c => { const a = parseISO(c.criadoEm), b = parseISO(c.atualizadoEm); return (a&&b) ? Math.max(0,Math.round((b-a)/86400000)) : null; }).filter(n => n !== null);
  const ciclo = ciclos.length ? Math.round(ciclos.reduce((a,b) => a+b,0)/ciclos.length) : null;

  const tiles = [
    {v:numCurto(potencial), r:"Potencial em aberto", d:"Entregas por mês · "+ativas.length+" contas"},
    {v:numCurto(Math.round(ponderado)), r:"Potencial ponderado", d:"Ajustado pela probabilidade da etapa"},
    {v:numCurto(ganho), r:"Entregas/mês conquistadas", d:ganhas.length+" contas fechadas"},
    {v:(taxa===null?"—":taxa+"%"), r:"Taxa de conversão", d:decididas?ganhas.length+" de "+decididas+" decididas":"Sem contas decididas"},
    {v:num(lojasAtivas), r:"Lojas em negociação", d:"Soma das redes ativas no funil"},
    {v:porLoja?num(porLoja):"—", r:"Entregas por loja", d:"Média mensal das contas em aberto"},
    {v:ganhas.length?numCurto(mediaGanha):"—", r:"Média por conta ganha", d:"Entregas por mês"},
    {v:(ciclo===null?"—":ciclo+" d"), r:"Ciclo médio", d:"Da criação ao fechamento"},
    {v:String(atrasadas), r:"Atividades em atraso", d:"Passaram da data combinada", alerta:atrasadas>0}
  ].map(t => '<div class="tile"><div class="eyebrow">'+esc(t.r)+'</div>' +
      '<div class="v"'+(t.alerta?' style="color:var(--danger)"':"")+'>'+esc(t.v)+'</div>' +
      '<div class="d">'+esc(t.d)+'</div></div>').join("");

  const maxV = Math.max(1, ...ETAPAS.map(e => soma(ativas.filter(c => c.etapa === e.k), "entregasMes")));
  const barras = ETAPAS.map(e => {
    const cs = ativas.filter(c => c.etapa === e.k), v = soma(cs,"entregasMes");
    return '<div class="barra" style="--st:'+e.cor+'">' +
      '<span class="b-nome">'+esc(e.nome)+'</span>' +
      '<span class="b-trilho"><span class="b-fill" style="width:'+Math.round(v/maxV*100)+'%"></span></span>' +
      '<span class="b-val">'+(v?numCurto(v):"—")+' · '+cs.length+' conta'+(cs.length===1?"":"s")+'</span></div>';
  }).join("");

  const pend = pendentesGlobais();
  const porTipo = TIPOS_ATIVIDADE.map(t => {
    const as = pend.filter(a => a.tipo === t.k);
    const atr = as.filter(a => diasAte(a.data) < 0).length;
    return '<div class="kv" style="--at:'+t.cor+'"><span class="k"><i></i>'+esc(t.k)+'</span>' +
      '<span class="v">'+as.length+(atr?' · <span style="color:var(--danger)">'+atr+' em atraso</span>':"")+'</span></div>';
  }).join("");

  const painelTemp = '<div class="painel"><h3>Temperatura e fit</h3>' +
    '<p class="desc">Leitura do hunter sobre engajamento e aderência à operação Bee, nas contas em aberto.</p>' +
    TEMPERATURAS.map(t => {
      const cs = ativas.filter(c => c.temperatura === t);
      return '<div class="kv" style="--at:'+COR_TEMP[t]+'"><span class="k"><i></i>'+esc(t)+'</span>' +
        '<span class="v">'+cs.length+' · '+numCurto(soma(cs,"entregasMes"))+'</span></div>';
    }).join("") +
    (ativas.some(c => !c.temperatura)
      ? '<div class="kv"><span class="k" style="color:var(--ink-3)">Sem classificação</span>' +
        '<span class="v">'+ativas.filter(c => !c.temperatura).length+'</span></div>' : "") +
    '<div style="height:10px"></div>' +
    FITS.map(f => {
      const cs = ativas.filter(c => c.fit === f);
      if(!cs.length) return "";
      return '<div class="kv"><span class="k">Fit '+esc(f)+'</span><span class="v">'+cs.length+' · '+numCurto(soma(cs,"entregasMes"))+'</span></div>';
    }).join("") + '</div>';

  let painelEquipe = "";
  if(Store.perfis.size > 1){
    painelEquipe = '<div class="painel"><h3>Por responsável</h3><p class="desc">Como o funil está dividido no time.</p>' +
      [...Store.perfis.values()].map(p => {
        const suas = base.filter(c => c.responsavel === p.id);
        const abertas = suas.filter(c => c.status === "ativo");
        return '<div class="kv"><span class="k">'+esc(p.nome)+(p.papel==="gerente"?" · gerente":"")+'</span>' +
          '<span class="v">'+abertas.length+' em aberto · '+numCurto(soma(abertas,"entregasMes"))+'</span></div>';
      }).join("") + '</div>';
  }

  const porOrigem = {};
  base.forEach(c => {
    const o = c.origem || "Não informada";
    porOrigem[o] = porOrigem[o] || {n:0, g:0, v:0};
    porOrigem[o].n++; porOrigem[o].v += Number(c.entregasMes)||0;
    if(c.status === "ganho") porOrigem[o].g++;
  });
  const origemHTML = Object.entries(porOrigem).sort((a,b) => b[1].v - a[1].v).map(([o,d]) =>
    '<div class="kv"><span class="k">'+esc(o)+'</span><span class="v">'+d.n+' · '+numCurto(d.v)+(d.g?' · '+d.g+' ganha'+(d.g>1?"s":""):"")+'</span></div>').join("")
    || '<div class="kv"><span class="k">Sem contas registradas</span><span class="v">—</span></div>';

  const porMotivo = {};
  perdidas.forEach(c => { const m = c.motivoPerda || "Não informado"; porMotivo[m] = (porMotivo[m]||0)+1; });
  const motivoHTML = Object.entries(porMotivo).sort((a,b) => b[1]-a[1]).map(([m,n]) =>
    '<div class="kv"><span class="k">'+esc(m)+'</span><span class="v">'+n+'</span></div>').join("")
    || '<div class="kv"><span class="k">Nenhuma conta perdida registrada</span><span class="v">—</span></div>';

  app.innerHTML = '<div class="page">' +
    '<div class="tiles">'+tiles+'</div>' +
    '<div class="painel"><h3>Potencial em aberto por etapa</h3>' +
    '<p class="desc">Entregas por mês, somadas por etapa do funil.</p>' +
    '<div class="barras">'+barras+'</div></div>' +
    '<div class="duo">' + painelEquipe + painelTemp +
      '<div class="painel"><h3>Atividades pendentes por tipo</h3><p class="desc">O que está agendado e o que passou da data.</p>'+porTipo+'</div>' +
      '<div class="painel"><h3>Origem da conta</h3><p class="desc">Quantidade, potencial de entregas e fechamentos por canal.</p>'+origemHTML+'</div>' +
      '<div class="painel"><h3>Motivos de perda</h3><p class="desc">Onde o funil está quebrando.</p>'+motivoHTML+'</div>' +
    '</div></div>';
}
