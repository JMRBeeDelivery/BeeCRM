function abrir(id){ UI.aberta = id; UI.novaConta = false; UI.aba = "dados"; UI.concluindo = null; renderDrawer(); }
function abrirNova(){ UI.aberta = "__nova__"; UI.novaConta = true; UI.aba = "dados"; renderDrawer(); }
function fechar(){ UI.aberta = null; UI.novaConta = false; UI.concluindo = null; renderDrawer(); }

let rascunho = null;
function contaEmEdicao(){
  if(UI.novaConta){
    if(!rascunho) rascunho = {
      id:uid(), empresa:"", cnpj:"", setor:"", porte:PORTES[1], origem:ORIGENS[0],
      contatoNome:"", contatoCargo:"", contatoEmail:"", contatoTel:"",
      decisorNome:"", decisorCargo:"", praca:"", tag:"", entregasMes:0, lojas:0,
      temperatura:"", sistema:"", raioKm:"", fit:"", previsaoFechamento:"",
      fechadaEm:"", perdidaEm:"", reuniaoEm:"",
      etapa:"prospeccao", status:"ativo", probabilidade:ETAPAS[0].prob,
      checklist:{}, notas:"", motivoPerda:"", responsavel:Auth.uid,
      entradaEtapa:hojeISO(), exemplo:false, criadoEm:hojeISO(), atualizadoEm:hojeISO()
    };
    return rascunho;
  }
  return Store.contas.get(UI.aberta) || null;
}

function renderDrawer(){
  if(!UI.aberta){ overlay.innerHTML = ""; rascunho = null; return; }
  const c = contaEmEdicao();
  if(!c){ overlay.innerHTML = ""; UI.aberta = null; return; }
  const e = ETAPA[c.etapa] || ETAPAS[0];
  const ativs = UI.novaConta ? [] : atividadesDe(c.id);
  const pend = ativs.filter(a => a.status !== "concluida");
  const evs = UI.novaConta ? [] : interacoesDe(c.id);
  const diasNaEtapa = c.entradaEtapa ? Math.max(0, -(diasAte(c.entradaEtapa))) : null;

  const anexos = UI.novaConta ? [] : anexosDe(c.id);
  const rotulos = {dados:"Dados", atividades:"Atividades ("+pend.length+")",
                   historico:"Histórico ("+evs.length+")",
                   anexos:"Anexos ("+anexos.length+")", etapa:"Critérios"};
  const cabecalho =
    '<div class="dr-head"><div class="dr-head-top">' +
      '<div style="flex:1"><h2>'+esc(UI.novaConta ? "Nova conta" : c.empresa)+'</h2>' +
      '<div class="dr-sub">'+(UI.novaConta ? "Dimensione a rede e agende o primeiro contato."
        : esc([c.setor, c.porte].filter(Boolean).join(" · ")) + (c.cnpj ? ' · <span class="mono">'+esc(c.cnpj)+'</span>' : "")) + '</div></div>' +
      '<button class="btn btn-ghost btn-sm" id="dr-fechar" aria-label="Fechar">Fechar</button>' +
    '</div>' +
    (UI.novaConta ? '<div class="dr-tabs"></div>' :
      '<div class="dr-tabs" role="tablist">' +
        ["dados","atividades","historico","anexos","etapa"].map(t =>
          '<button role="tab" data-aba="'+t+'" aria-selected="'+(UI.aba===t)+'">'+esc(rotulos[t])+'</button>').join("") +
      '</div>') +
    '</div>';

  let corpo = "";
  if(UI.aba === "dados" || UI.novaConta) corpo = formDados(c, e, diasNaEtapa, pend[0]);
  else if(UI.aba === "atividades") corpo = abaAtividades(c, ativs);
  else if(UI.aba === "historico") corpo = abaHistorico(c, evs);
  else if(UI.aba === "anexos") corpo = abaAnexos(c, anexos);
  else corpo = abaEtapa(c, e);

  const rodape = UI.novaConta
    ? '<button class="btn btn-primary" id="dr-salvar">Criar conta</button><button class="btn btn-ghost" id="dr-cancelar">Cancelar</button>'
    : '<button class="btn btn-primary" id="dr-salvar">Salvar alterações</button>' +
      (c.status === "ativo"
        ? '<button class="btn" id="dr-ganho">Marcar como ganha</button>' +
          '<button class="btn" id="dr-perdido">Marcar como perdida</button>' +
          '<button class="btn btn-ghost btn-sm" id="dr-congelar">Congelar</button>'
        : '<button class="btn" id="dr-reabrir">Reabrir</button>') +
      '<span class="spacer"></span><button class="btn btn-danger btn-sm" id="dr-excluir">Excluir</button>';

  overlay.innerHTML = '<div class="scrim" id="dr-scrim"></div>' +
    '<aside class="drawer" role="dialog" aria-modal="true" aria-label="Detalhe da conta" style="--st:'+e.cor+'">' +
    cabecalho + '<div class="dr-body">'+corpo+'</div><div class="dr-foot">'+rodape+'</div></aside>';

  ligarDrawer(c, e);
}

function selResponsavel(sel){
  return [...Store.perfis.values()].sort((a,b) => a.nome.localeCompare(b.nome))

  '<fieldset class="bloco"><legend>Posição no funil</legend>' +
    '<div class="grade2">' +
      '<div class="campo"><label for="f-etapa">Etapa</label><select id="f-etapa">'+ETAPAS.map(x => '<option value="'+x.k+'"'+(x.k===c.etapa?" selected":"")+">"+esc(x.nome)+"</option>").join("")+'</select></div>' +
      '<div class="campo"><label for="f-prob">Probabilidade (%)</label><input id="f-prob" class="mono" type="number" min="0" max="100" step="5" value="'+(Number(c.probabilidade)||0)+'"></div>' +
      '<div class="campo"><label for="f-previsao">Previsão de fechamento</label>' +
        '<input id="f-previsao" type="date" value="'+esc(String(c.previsaoFechamento||"").slice(0,10))+'"></div>' +
    '</div>' +
    '<div class="campo"><label for="f-notas">Notas da conta</label><textarea id="f-notas" placeholder="Estrutura de compra, operação logística atual, concorrentes, sazonalidade…">'+esc(c.notas)+'</textarea></div>' +
    (UI.novaConta ? '<p class="hint" style="margin:-6px 0 0">Depois de criar, agende a primeira atividade na aba <strong>Atividades</strong>.</p>' : "") +
  '</fieldset>';
}

function abaAtividades(c, ativs){
  const pend = ativs.filter(a => a.status !== "concluida");
  const feitas = ativs.filter(a => a.status === "concluida").reverse();

  const novo =
    '<div class="novo-bloco"><div class="eyebrow" style="margin-bottom:9px">Agendar atividade</div>' +
      '<div class="campo"><label for="a-tipo">Tipo</label><select id="a-tipo">'+TIPOS_ATIVIDADE.map(t => '<option value="'+esc(t.k)+'">'+esc(t.k)+'</option>').join("")+'</select></div>' +
      '<div class="grade2">' +
        '<div class="campo"><label for="a-data">Data</label><input id="a-data" type="date" value="'+hojeISO()+'"></div>' +
        '<div class="campo"><label for="a-hora">Hora <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><input id="a-hora" type="time"></div>' +
      '</div>' +
      '<div class="campo"><label for="a-desc">O que será feito</label><input id="a-desc" placeholder="Ex.: Confirmar pauta da reunião com a Diretora de Canais"></div>' +
      '<button class="btn btn-primary btn-sm" id="a-add">Agendar</button></div>';

  const listaPend = pend.length ? pend.map(a => {
    const d = diasAte(a.data);
    const atrasada = d < 0;
    const quando = fmtData(a.data) + (a.hora ? " · "+esc(a.hora) : "") +
      (atrasada ? " · "+Math.abs(d)+" d em atraso" : d === 0 ? " · hoje" : d === 1 ? " · amanhã" : " · em "+d+" d");
    const fechando = UI.concluindo === a.id;
    return '<div class="ativ'+(atrasada?" atrasada":"")+'" style="--at:'+corDe(a.tipo)+'">' +
      '<div class="ativ-top"><span class="ativ-tipo">'+esc(a.tipo)+'</span><span class="ativ-quando">'+quando+'</span>' +
      (a.exemplo ? '<span class="chip ex">exemplo</span>' : "") + '</div>' +
      '<div class="ativ-desc">'+esc(a.descricao || "—")+'</div>' +
      (fechando
        ? '<div class="ativ-fechar"><label class="sr" for="a-res-'+esc(a.id)+'">Como foi</label>' +
          '<textarea id="a-res-'+esc(a.id)+'" placeholder="Como foi? O que ficou combinado?">'+esc(a.descricao || "")+'</textarea>' +
          '<div class="ativ-acoes"><button class="btn btn-primary btn-sm" data-confirmar="'+esc(a.id)+'">Registrar no histórico</button>' +
          '<button class="btn btn-ghost btn-sm" data-cancelar-conclusao="1">Cancelar</button></div></div>'
        : '<div class="ativ-acoes">' +
          '<button class="btn btn-sm" data-abrir-conclusao="'+esc(a.id)+'">Concluir</button>' +
          '<label class="sr" for="a-re-'+esc(a.id)+'">Reagendar</label>' +
          '<input id="a-re-'+esc(a.id)+'" type="date" value="'+esc(a.data)+'" data-reagendar="'+esc(a.id)+'">' +
          '<button class="btn btn-ghost btn-sm" data-excluir-ativ="'+esc(a.id)+'">Excluir</button></div>') +
      '</div>';
  }).join("") : '<div class="vazio">Nenhuma atividade agendada. Toda conta em aberto precisa de um próximo passo com data.</div>';

  const listaFeitas = feitas.length
    ? '<div class="eyebrow" style="margin:20px 0 10px">Concluídas</div>' + feitas.slice(0,12).map(a =>
      '<div class="ativ feita" style="--at:'+corDe(a.tipo)+'"><div class="ativ-top">' +
      '<span class="ativ-tipo">'+esc(a.tipo)+'</span><span class="ativ-quando">'+fmtData(a.data)+'</span></div>' +
      '<div class="ativ-desc">'+esc(a.descricao || "—")+'</div></div>').join("")
    : "";

  return novo + '<div class="eyebrow" style="margin:0 0 10px">Pendentes</div>' + listaPend + listaFeitas;
}

function abaHistorico(c, evs){
  const novo =
    '<div class="novo-bloco"><div class="eyebrow" style="margin-bottom:9px">Registrar interação já ocorrida</div>' +
      '<div class="grade2">' +
        '<div class="campo"><label for="i-tipo">Tipo</label><select id="i-tipo">'+opcoes(TIPOS_INTERACAO, "Telefonema")+'</select></div>' +
        '<div class="campo"><label for="i-data">Data</label><input id="i-data" type="date" value="'+hojeISO()+'"></div>' +
      '</div>' +
      '<div class="campo"><label for="i-resumo">O que aconteceu</label><textarea id="i-resumo" placeholder="Quem participou, o que foi acordado, qual a objeção…"></textarea></div>' +
      '<button class="btn btn-primary btn-sm" id="i-add">Registrar</button></div>';

  const linha = evs.length ? '<div class="timeline">' + evs.map(ev => {
    const autor = ev.criadoPor ? primeiroNome(Store.nomeDe(ev.criadoPor)) : "";
    return '<div class="ev" style="--at:'+corDe(ev.tipo)+'"><span class="ev-dot'+(TIPOS_NEG.has(ev.tipo)?" neg":"")+'"></span><div>' +
      '<div class="ev-top"><span class="ev-tipo">'+esc(ev.tipo)+'</span>' +
      '<span class="ev-data">'+fmtData(ev.data)+'</span>' +
      (autor && Store.perfis.size > 1 ? '<span class="ev-autor">'+esc(autor)+'</span>' : "") +
      (ev.exemplo ? '<span class="chip ex">exemplo</span>' : "") +
      '<button class="ev-del" data-ev="'+esc(ev.id)+'" aria-label="Excluir interação">excluir</button></div>' +
      '<div class="ev-txt">'+esc(ev.resumo)+'</div></div></div>';
  }).join("") + '</div>'
    : '<div class="vazio">Nenhuma interação registrada. Concluir uma atividade agendada também escreve aqui.</div>';

  return novo + '<div class="eyebrow" style="margin:20px 0 10px">Linha do tempo</div>' + linha;
}

function abaAnexos(c, anexos){
  if(Store.anexosOk === false){
    return '<div class="vazio">Os anexos ainda não estão ligados neste banco.<br>' +
      'Rode <strong>migracao-anexos.sql</strong> no Supabase para habilitar.</div>';
  }
  const total = anexos.reduce((s,a) => s + (Number(a.tamanho)||0), 0);
  const solta =
    '<div class="solta" id="zona-anexo" tabindex="0" role="button" aria-label="Enviar arquivo">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' +
      '<path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>' +
      '<b>Arraste os arquivos aqui</b>' +
      '<span>ou clique para escolher · até 25 MB cada</span>' +
      '<input type="file" id="arq-input" multiple hidden>' +
    '</div>';

  const lista = anexos.length ? '<div class="arq-lista">' + anexos.map(a =>
    '<div class="arq">' +
      '<span class="arq-ic">'+esc(iconeArquivo(a.nome))+'</span>' +
      '<span class="arq-txt"><b>'+esc(a.nome)+'</b>' +
        '<small>'+tamanhoLegivel(a.tamanho)+' · '+fmtData(a.criadoEm)+
        (a.criadoPor && Store.perfis.size > 1 ? ' · '+esc(primeiroNome(Store.nomeDe(a.criadoPor))) : "")+'</small></span>' +
      '<button class="btn btn-sm" data-baixar="'+esc(a.id)+'">Baixar</button>' +
      '<button class="btn btn-ghost btn-sm" data-apagar-anexo="'+esc(a.id)+'" aria-label="Excluir anexo">✕</button>' +
    '</div>').join("") + '</div>'
    : '<div class="vazio">Nenhum arquivo anexado. Proposta, minuta, contrato assinado, planilha de volumes — tudo que sustenta a negociação fica aqui.</div>';

  return solta +
    '<div class="eyebrow" style="margin:20px 0 10px">Arquivos' +
      (anexos.length ? ' · '+anexos.length+' · '+tamanhoLegivel(total) : "") + '</div>' +
    lista;
}

function abaEtapa(c, e){
  const marcas = (c.checklist && c.checklist[c.etapa]) || [];
  const feitos = e.criterios.filter((_,i) => marcas[i]).length;
  const itens = e.criterios.map((t,i) =>
    '<label class="check'+(marcas[i]?" ok":"")+'"><input type="checkbox" data-crit="'+i+'"'+(marcas[i]?" checked":"")+'><span>'+esc(t)+'</span></label>').join("");
  const proxima = ETAPAS[ETAPAS.findIndex(x => x.k === c.etapa)+1];
  return '<div class="eyebrow">Critérios de saída · '+esc(e.nome)+'</div>' +
    '<p style="margin:6px 0 16px;font-size:12.5px;color:var(--ink-3)">Só avance a conta quando os quatro estiverem cumpridos. ' +
      '<strong style="color:var(--ink-2)">'+feitos+' de '+e.criterios.length+'</strong> marcados.</p>' + itens +
    (proxima && c.status === "ativo"
      ? '<button class="btn btn-primary" id="dr-avancar" style="margin-top:14px">Avançar para '+esc(proxima.nome)+'</button>'
      : (c.status === "ativo" ? '<p style="margin-top:14px;font-size:12.5px;color:var(--ink-3)">Última etapa do funil. Use <strong>Marcar como ganha</strong> quando o contrato estiver assinado.</p>' : "")) +
    '<hr class="sep" style="margin:22px 0 16px">' +
    '<div class="eyebrow" style="margin-bottom:10px">Todas as etapas</div>' +
    ETAPAS.map(x => '<div class="kv"><span class="k" style="color:'+(x.k===c.etapa?"var(--ink)":"var(--ink-2)")+';font-weight:'+(x.k===c.etapa?"600":"400")+'">'+esc(x.nome)+'</span><span class="v">'+x.prob+'%</span></div>').join("");
}

function lerForm(c){
  const g = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  if(!document.getElementById("f-empresa")) return c;
  const etapaNova = g("f-etapa") || c.etapa;
  if(etapaNova !== c.etapa) c.entradaEtapa = hojeISO();
  c.empresa = g("f-empresa").trim();
  c.cnpj = g("f-cnpj").trim();
  c.setor = g("f-setor").trim();
  c.porte = g("f-porte");
  c.origem = g("f-origem");
  c.praca = g("f-praca").trim();
  c.tag = g("f-tag");
  c.temperatura = g("f-temp");
  c.responsavel = g("f-resp-conta") || c.responsavel;
  c.entregasMes = Math.max(0, Number(g("f-mes")) || 0);
  c.lojas = Math.max(0, Number(g("f-lojas")) || 0);
  c.raioKm = g("f-raio") === "" ? "" : Math.max(0, Number(g("f-raio")) || 0);
  c.sistema = g("f-sistema").trim();
  c.fit = g("f-fit");
  c.previsaoFechamento = g("f-previsao") || "";
  c.contatoNome = g("f-cnome").trim();
  c.contatoCargo = g("f-ccargo").trim();
  c.contatoEmail = g("f-cmail").trim();
  c.contatoTel = g("f-ctel").trim();
  c.decisorNome = g("f-dnome").trim();
  c.decisorCargo = g("f-dcargo").trim();
  c.etapa = etapaNova;
  c.probabilidade = Math.max(0, Math.min(100, Number(g("f-prob")) || 0));
  c.notas = g("f-notas");
  return c;
}

function ligarDrawer(c, e){
  document.getElementById("dr-scrim").onclick = fechar;
  document.getElementById("dr-fechar").onclick = fechar;
  overlay.querySelectorAll(".dr-tabs button").forEach(b => b.onclick = () => { UI.aba = b.dataset.aba; UI.concluindo = null; renderDrawer(); });

  const salvar = document.getElementById("dr-salvar");
  if(salvar) salvar.onclick = () => {
    const etapaAntes = c.etapa;          // antes de lerForm, que já sobrescreve
    lerForm(c);
    if(!c.empresa){ toast("Informe o nome da conta."); const el = document.getElementById("f-empresa"); if(el) el.focus(); return; }
    const nova = UI.novaConta;
    Store.salvarConta(c);
    if(nova){ UI.novaConta = false; rascunho = null; UI.aberta = c.id; UI.aba = "atividades"; }
    else if(c.etapa !== etapaAntes) registrarEtapa(c, etapaAntes, c.etapa);
    toast(nova ? "Conta criada. Agende a primeira atividade."
      : (c.etapa !== etapaAntes ? "Salvo. "+c.empresa+" → "+ETAPA[c.etapa].nome : "Alterações salvas."));
    renderDrawer();
  };
  const cancelar = document.getElementById("dr-cancelar");
  if(cancelar) cancelar.onclick = fechar;

  const ganho = document.getElementById("dr-ganho");
  if(ganho) ganho.onclick = () => {
    const etapaAnterior = c.etapa;       // antes de lerForm, que já sobrescreve
    lerForm(c);
    c.status = "ganho"; c.etapa = "fechamento"; c.probabilidade = 100; c.motivoPerda = "";
    c.fechadaEm = hojeISO();
    Store.salvarConta(c);
    Store.salvarInteracao({id:uid(), contaId:c.id, tipo:"Nota interna", data:hojeISO(),
      etapaDe:etapaAnterior, etapaPara:"fechamento",
      resumo:"Conta ganha. "+num(c.lojas)+" lojas, "+num(c.entregasMes)+" entregas/mês previstas."});
    toast("🎉 "+c.empresa+" fechada — "+numCurto(c.entregasMes)+" entregas/mês"); renderDrawer();
  };
  const perdido = document.getElementById("dr-perdido");
  if(perdido) perdido.onclick = () => {
    const m = prompt("Motivo da perda:\n\n"+MOTIVOS_PERDA.map((x,i) => (i+1)+". "+x).join("\n")+"\n\nDigite o número ou escreva o motivo.");
    if(m === null) return;
    const n = parseInt(m,10);
    const motivo = (n >= 1 && n <= MOTIVOS_PERDA.length) ? MOTIVOS_PERDA[n-1] : (m.trim() || "Não informado");
    const etapaNaPerda = c.etapa;
    lerForm(c);
    c.status = "perdido"; c.motivoPerda = motivo; c.probabilidade = 0; c.perdidaEm = hojeISO();

    /* A conta morreu no Agendamento: a reunião pode ter acontecido e o
       lead simplesmente não avançou. Sem perguntar, o esforço some da meta. */
    let notaReuniao = "";
    if(etapaNaPerda === "agendamento" && !c.reuniaoEm){
      if(confirm("A reunião chegou a acontecer com “"+c.empresa+"”?\n\n" +
                 "OK = sim, a reunião foi realizada (conta na meta de reuniões realizadas)\n" +
                 "Cancelar = não, a reunião não aconteceu")){
        /* usa a data da reunião concluída na agenda, se houver; senão, hoje */
        const feita = atividadesDe(c.id)
          .filter(a => a.tipo === "Reunião" && a.status === "concluida")
          .sort((x,y) => String(y.concluidaEm||y.data).localeCompare(String(x.concluidaEm||x.data)))[0];
        c.reuniaoEm = feita ? (feita.concluidaEm || feita.data) : hojeISO();
        notaReuniao = " Reunião realizada em " + fmtData(c.reuniaoEm) + ", sem avanço para Maturação.";
      }
    }

    Store.salvarConta(c);
    Store.salvarInteracao({id:uid(), contaId:c.id, tipo:"Nota interna", data:hojeISO(),
      resumo:"Conta perdida. Motivo: "+motivo+"."+notaReuniao});
    toast(notaReuniao ? "Perdida, mas a reunião entrou na meta." : "Conta marcada como perdida.");
    renderDrawer();
  };
  const congelar = document.getElementById("dr-congelar");
  if(congelar) congelar.onclick = () => { lerForm(c); c.status = "congelado"; Store.salvarConta(c); toast("Conta congelada."); renderDrawer(); };
  const reabrir = document.getElementById("dr-reabrir");
  if(reabrir) reabrir.onclick = () => {
    c.status = "ativo"; c.motivoPerda = ""; c.probabilidade = ETAPA[c.etapa].prob;
    c.fechadaEm = ""; c.perdidaEm = "";
    Store.salvarConta(c); UI.aba = "atividades"; toast("Conta reaberta. Agende o próximo passo."); renderDrawer();
  };
  const excluir = document.getElementById("dr-excluir");
  if(excluir) excluir.onclick = () => {
    if(confirm("Excluir “"+c.empresa+"”, suas atividades e todo o histórico? Esta ação não pode ser desfeita e vale para as duas pessoas do time.")){
      Store.excluirConta(c.id); fechar(); toast("Conta excluída.");
    }
  };

  const addAtiv = document.getElementById("a-add");
  if(addAtiv) addAtiv.onclick = () => {
    const desc = document.getElementById("a-desc").value.trim();
    const data = document.getElementById("a-data").value;
    if(!data){ toast("Escolha a data da atividade."); return; }
    if(!desc){ toast("Descreva o que será feito."); document.getElementById("a-desc").focus(); return; }
    Store.salvarAtividade({
      id:uid(), contaId:c.id, tipo:document.getElementById("a-tipo").value,
      data:data, hora:document.getElementById("a-hora").value || "",
      descricao:desc, status:"pendente", concluidaEm:null, exemplo:false
    });
    toast("Atividade agendada para "+fmtData(data)+"."); renderDrawer();
  };
  overlay.querySelectorAll("[data-abrir-conclusao]").forEach(b => b.onclick = () => { UI.concluindo = b.dataset.abrirConclusao; renderDrawer(); });
  overlay.querySelectorAll("[data-cancelar-conclusao]").forEach(b => b.onclick = () => { UI.concluindo = null; renderDrawer(); });
  overlay.querySelectorAll("[data-confirmar]").forEach(b => b.onclick = () => {
    const a = Store.atividades.get(b.dataset.confirmar); if(!a) return;
    const ta = document.getElementById("a-res-"+a.id);
    concluirAtividade(a, (ta && ta.value.trim()) || a.descricao);
    renderDrawer();
  });
  overlay.querySelectorAll("[data-reagendar]").forEach(el => el.onchange = () => {
    const a = Store.atividades.get(el.dataset.reagendar); if(!a || !el.value) return;
    a.data = el.value; Store.salvarAtividade(a);
    toast("Reagendada para "+fmtData(el.value)+"."); renderDrawer();
  });
  overlay.querySelectorAll("[data-excluir-ativ]").forEach(b => b.onclick = () => { Store.excluirAtividade(b.dataset.excluirAtiv); renderDrawer(); });

  const addInt = document.getElementById("i-add");
  if(addInt) addInt.onclick = () => {
    const resumo = document.getElementById("i-resumo").value.trim();
    if(!resumo){ toast("Descreva o que aconteceu."); document.getElementById("i-resumo").focus(); return; }
    Store.salvarInteracao({id:uid(), contaId:c.id, tipo:document.getElementById("i-tipo").value,
      data:document.getElementById("i-data").value || hojeISO(), resumo:resumo, exemplo:false});
    toast("Interação registrada."); renderDrawer();
  };
  overlay.querySelectorAll(".ev-del").forEach(b => b.onclick = () => { Store.excluirInteracao(b.dataset.ev); renderDrawer(); });

  /* anexos */
  const zona = document.getElementById("zona-anexo");
  if(zona){
    const entrada = document.getElementById("arq-input");
    let enviando = false;

    const enviar = async lista => {
      const arquivos = [...lista];
      if(!arquivos.length || enviando) return;
      enviando = true;
      zona.classList.add("enviando");
      zona.querySelector("b").textContent = "Enviando " + arquivos.length + " arquivo" + (arquivos.length > 1 ? "s" : "") + "…";
      let ok = 0;
      for(const f of arquivos){ if(await Store.enviarAnexo(c.id, f)) ok++; }
      enviando = false;
      if(ok) toast(ok + (ok > 1 ? " arquivos anexados." : " arquivo anexado."));
      renderDrawer();
    };

    zona.onclick = () => { if(!enviando) entrada.click(); };
    zona.onkeydown = ev => { if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); entrada.click(); } };
    entrada.onchange = () => { enviar(entrada.files); entrada.value = ""; };
    zona.ondragover = ev => { ev.preventDefault(); zona.classList.add("sobre"); };
    zona.ondragleave = () => zona.classList.remove("sobre");
    zona.ondrop = ev => {
      ev.preventDefault(); zona.classList.remove("sobre");
      if(ev.dataTransfer && ev.dataTransfer.files) enviar(ev.dataTransfer.files);
    };
  }
  overlay.querySelectorAll("[data-baixar]").forEach(b => b.onclick = () => {
    const a = Store.anexos.get(b.dataset.baixar); if(a) Store.baixarAnexo(a);
  });
  overlay.querySelectorAll("[data-apagar-anexo]").forEach(b => b.onclick = () => {
    const a = Store.anexos.get(b.dataset.apagarAnexo); if(!a) return;
    if(confirm("Excluir “"+a.nome+"”? O arquivo sai para as duas pessoas do time e não dá para desfazer.")){
      Store.excluirAnexo(a); renderDrawer();
    }
  });

  overlay.querySelectorAll("[data-crit]").forEach(cb => cb.onchange = () => {
    c.checklist = c.checklist || {};
    const arr = (c.checklist[c.etapa] || []).slice();
    arr[Number(cb.dataset.crit)] = cb.checked;
    c.checklist = Object.assign({}, c.checklist); c.checklist[c.etapa] = arr;
    Store.salvarConta(c); renderDrawer();
  });
  const avancar = document.getElementById("dr-avancar");
  if(avancar) avancar.onclick = () => {
    const i = ETAPAS.findIndex(x => x.k === c.etapa);
    moverEtapa(c.id, ETAPAS[i+1].k); renderDrawer();
  };
}
